      x-roles: [customer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The custom domain, or null
          content:
            application/json:
              schema:
                type: object
                required: [customDomain]
                properties:
                  customDomain:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/CustomDomain"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /growthx_core.api.v1.customer.add_custom_domain:
    post:
      tags: [customer]
      summary: Add a custom domain to a site
      description: |
        Starts as `pending_dns`, with the DNS records the customer can add at their domain provider (`records`; no TXT,
        Press checks the record points at the site). A subdomain (`app.noorsolar.com`) gets two options: a CNAME to the
        site's `<subdomain>.tbogrowthx.com` address (`recommended`), or an A record to the proxy's fixed IP. A root domain
        (`noorsolar.com`) gets the A record only. The A record and root domains need `growthx_custom_domain_ip` in Core's
        site_config; without it, only subdomains with a CNAME. One custom domain per site. Paid plans only: today a
        subscription that isn't `active` (e.g. a trial) gets `403 plan_required`. Lower-cased.
        `403 plan_required`: the site's subscription is on a trial or a plan without custom domains.
        `409 domain_taken`: another site uses it. `409 domain_exists`: this site already has one (remove it first).
        `409 site_not_ready`: the site isn't `ready`. `422 validation_failed` with `fields.domain`: not a valid domain, a system
        domain (tbogrowthx.com, tbocloud.in and Press's other domains), or a root domain when Core has no A-record IP.
      operationId: addCustomDomain
      x-phase: 2
      x-roles: [customer]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, domain]
              properties:
                id: { type: string, description: The site's id }
                domain: { type: string, example: app.noorsolar.com }
      responses:
        "201":
          description: Added; waiting for DNS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomDomain" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`plan_required`: custom domains need a paid plan"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`domain_taken`, `domain_exists` or `site_not_ready`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.customer.check_custom_domain:
    post:
      tags: [customer]
      summary: Check the DNS records now
      description: |
        Core also checks on its own schedule; this is the customer's "Check now". Core runs Press's
        `site.check_dns`; when the record is right it calls `site.add_domain` and the status moves to `verifying` (Press is
        getting the Let's Encrypt certificate), then `active` once `site.domains` says so, at which point Core makes it the
        primary host (`site.set_host_name`) and "Open my app" uses it. When the record isn't right yet the status stays
        `pending_dns` with a `dnsProblem` saying why, and `message` says how to fix it. A domain another site on Press
        already has ends as `failed` with a `message` (no `dnsProblem`): remove it and contact support. If Press can't be
        reached the status doesn't change and `message` says to try again. Scheduled checks: every 10 minutes, for 3 days
        after adding while `pending_dns`, and until done while `verifying`. 6 checks a minute per site (`429`). `404` when
        the site has no custom domain.
      operationId: checkCustomDomain
      x-phase: 2
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The site's id }
      responses:
        "200":
          description: The domain after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomDomain" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.customer.remove_custom_domain:
    post:
      tags: [customer]
      summary: Remove the site's custom domain
      description: |
        The site keeps working at its tbogrowthx.com address (Core makes that the primary host again first). `404` when the
        site has no custom domain. `503 hosting_unavailable` when Press can't be reached: nothing changed, try again.
      operationId: removeCustomDomain
