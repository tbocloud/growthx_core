  /growthx_core.api.v1.admin.create_plan:
    post:
      tags: [admin]
      summary: Add a plan to the catalogue
      description: |
        Creates a GX Plan and its billing Item (with the SAC code and tax template when India
        Compliance is installed). `id` is the plan id; without one it is made from the app, the name
        and the interval. Prices are in paise, like the rest of this API.
      operationId: adminCreatePlan
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
