        "200":
          description: The closed ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.admin.support_summary:
    get:
      tags: [admin]
      summary: Support counts and staff
      description: |
        Counts per status, open tickets with nobody assigned, open urgent ones, and the GrowthX Admin users a ticket can be assigned to.
      operationId: adminSupportSummary
      x-phase: 2
      x-roles: [admin]
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSupportSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /growthx_core.api.v1.admin.support_tickets:
    get:
      tags: [admin]
      summary: Support inbox
      description: |
        All tickets. `assignee` is a user id, `me` or `unassigned`. `q` searches subject, ticket number, customer email and company.
      operationId: adminListSupportTickets
      x-phase: 2
      x-roles: [admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TicketStatus" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/TicketPriority" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/TicketCategory" }
        - name: assignee
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [activity, -activity, createdAt, -createdAt, priority, -priority], default: -activity }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminTicket" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.support_ticket:
    get:
      tags: [admin]
      summary: A ticket with internal notes
      description: |
        The whole conversation including internal notes (`internal: true`).
      operationId: adminGetSupportTicket
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /growthx_core.api.v1.admin.support_reply:
    post:
      tags: [admin]
      summary: Reply to the customer
      description: |
        The customer sees and is emailed this reply. Sets the ticket to `pending_customer`, records the first response time and assigns the replier when nobody is. Audit-logged. `409 ticket_closed` on a closed ticket.
      operationId: adminReplySupportTicket
      x-phase: 2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, message]
              properties:
                id: { type: string }
                message: { type: string, minLength: 1, maxLength: 5000, description: Plain text }
      responses:
        "200":
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`ticket_closed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.support_note:
    post:
      tags: [admin]
      summary: Add an internal note
      description: |
        Never shown to the customer and never emailed. Audit-logged.
      operationId: adminNoteSupportTicket
      x-phase: 2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, note]
              properties:
                id: { type: string }
                note: { type: string, minLength: 1, maxLength: 5000, description: Plain text }
      responses:
        "200":
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.support_update:
    post:
      tags: [admin]
      summary: Change status, priority or assignee
      description: |
        Only the keys sent change; `assigneeId: null` unassigns. Status flow: open -> pending_customer / resolved / closed; pending_customer -> open / resolved / closed; resolved -> open / pending_customer / closed; closed -> open. Anything else is `409 invalid_transition`. `assigneeId` must be a GrowthX Admin user (`422`). Audit-logged.
      operationId: adminUpdateSupportTicket
      x-phase: 2
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                status: { $ref: "#/components/schemas/TicketStatus" }
                priority: { $ref: "#/components/schemas/TicketPriority" }
                assigneeId: { type: string, nullable: true }
      responses:
        "200":
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    tenantKey:
      type: apiKey
      in: header
      name: X-GX-Tenant-Key
      description: |
        A tenant site's own secret (`gxt_…`), written to its site_config as `growthx_tenant_key` during
        provisioning. Used only by tenant sites calling `tenant.*` endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque access token from `auth.login`, `auth.signup` or `auth.refresh`. It lasts 1 hour.
        Refresh tokens last 30 days and rotate on every use. Logging out, resetting the password or disabling
        the user revokes the tokens. An expired or revoked token returns 401 `unauthenticated`.

    webKey:
      type: apiKey
      in: header
      name: X-GrowthX-Web-Key
      description: |
        The websites' shared server secret (Core's `growthx_web_key`, `GROWTHX_WEB_KEY` on the sites). Optional on
        `content.*`: with the right key those calls skip the per-IP rate limit (all six sites call Core from one
        server address). Without it they are limited to 60 per minute per IP. Never sent from a browser.
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Id:
      name: id
      in: query
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A UUID chosen by the client. Reusing the same key within 24 h returns the original response.
      schema: { type: string, format: uuid }

    ContentSiteSlug:
      name: site
      in: query
      required: true
      schema: { $ref: "#/components/schemas/ContentSiteSlugValue" }

  responses:
    SocialSignupRequired:
      description: No account with this email yet. Show the sign-up form and send `signupToken` to `auth.signup` as `socialToken`.
      content:
        application/json:
          schema:
            type: object
            required: [signupRequired, signupToken, expiresAt, email, name]
            properties:
              signupRequired: { type: boolean, enum: [true] }
              signupToken: { type: string, example: gxs_..., description: "For `auth.signup`; works for one account" }
              expiresAt: { type: string, format: date-time, description: 30 minutes from now }
              email: { type: string, format: email }
              name: { type: string, description: "The provider account's name; may be empty" }
              provider: { type: string, enum: [google, microsoft, github] }
              emailVerified: { type: boolean, description: "False for a Microsoft work account whose email isn't verified: `auth.signup` then needs `emailCode`" }
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, enum: [true] }
    Unauthenticated:
      description: "`unauthenticated`: no token, or the token is expired or revoked"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden`: the user's role can't call this endpoint"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: the resource doesn't exist or doesn't belong to the caller"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: "`validation_failed`: the request is invalid; see `fields`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`: too many requests. The `Retry-After` header gives the number of seconds to wait."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentUnavailable:
      description: "`payment_unavailable`: the payment gateway is not configured or not reachable. Show a friendly message and let the user try later."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: "`internal_error`: show a friendly message together with `reference`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable code. Current list: unauthenticated, invalid_credentials, invalid_token, forbidden,
                not_found, validation_failed, email_taken, invalid_plan, invalid_reset_key,
                payment_verification_failed, payment_unavailable, site_not_ready, not_retryable,
                slot_taken, expert_busy, not_changeable, not_started,
                idempotency_conflict, rate_limited, bad_request, method_not_allowed, invalid_tenant_key,
                invalid_login_token, internal_error, no_account, site_not_found, not_linked, site_unavailable,
                payment_in_progress, billing_details_required.
                Proposed: duplicate_lead, invalid_otp.
              example: email_taken
            message: { type: string, example: An account with this email already exists. }
            fields:
              type: object
              additionalProperties: { type: string }
              example: { email: An account with this email already exists. }
            loginUrl:
              type: string
              format: uri
              description: "`not_linked` only: the site's own login page"
            reference: { type: string, description: Support reference (5xx responses only) }

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor units (paise), example: 149900 }
        currency: { type: string, enum: [INR] }

    Price:
      allOf:
        - $ref: "#/components/schemas/Money"
        - type: object
          required: [gstIncluded]
          properties:
            gstIncluded: { type: boolean, description: Whether `amount` already includes GST }

    BillingInterval:
      type: string
      enum: [month, year, one_time]
      description: |
        `one_time`: paid once, never expires (the launch "Lifetime" plan). Its subscription has `currentPeriodEnd:
        null`, never renews and counts 0 towards MRR. It's paid by bank transfer (recorded with
        `admin.record_payment`) or online (`billing.create_checkout`, PayU).

    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
      description: Which client is logging in. It is recorded with the token so it can be revoked per client.

    Role:
      type: string
      enum: [customer, partner, admin, content_editor]
      description: |
        `content_editor`: signs in to the /content portal through `auth.login` (password only for now). Their token
        reaches only the Website content endpoints (`admin.*content*`, which list `content_editor` in `x-roles`)
        and their own account (`auth.me`, `auth.logout`, `auth.logout_others`, `auth.change_password`); everything
        else, including `auth.site_login` and every other admin endpoint, returns `403`, and Frappe's own API
        doesn't accept the token. A user who is also an admin gets `admin`. In Core desk the same role keeps
        two-factor login.

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string, example: Amina Noor }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        company: { type: string, nullable: true, example: Noor Solar }
        partnerStatus:
          type: string
          enum: [pending_approval, active, suspended]
          nullable: true
          description: Set only for partners
        hasPassword:
          type: boolean
          description: |
            False for a Google sign-up that never set a password: show "Set a password" (Forgot password) instead of
            "Change password".
        socialLogins:
          type: array
          items: { type: string, enum: [google, microsoft, github] }
          description: "The providers linked to the account (Account settings, link and unlink)."

    ProvisioningHealth:
      type: object
      required: [status, problems, sites, jobs, scheduler, checkedAt]
      properties:
        status: { type: string, enum: [ok, alert] }
        problems:
          type: array
          items: { type: string, enum: [failed_sites, stuck_sites, no_workers, queue_unreachable, scheduler_not_running] }
        sites:
          type: object
          required: [failed, stuck]
          properties:
            failed: { type: integer }
            stuck: { type: integer }
        jobs:
          type: object
          nullable: true
          description: "Core's site-creation jobs on the `long` queue; null if Redis can't be reached"
          properties:
            queued: { type: integer }
            running: { type: integer }
            failedLast24h: { type: integer, description: "Jobs that crashed (e.g. timed out); the site then shows as stuck" }
            workers: { type: integer, description: Workers on the long queue }
        scheduler:
          type: object
          properties:
            active: { type: boolean }
            lastRun: { type: string, format: date-time, nullable: true, description: "Last run of resume_pending" }
        checkedAt: { type: string, format: date-time }

    AuthSession:
      type: object
      required: [accessToken, expiresAt, refreshToken, refreshExpiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Product:
      type: object
      required: [id, slug, name, category, summary, availability]
      properties:
        id: { type: string }
        slug: { type: string, example: solar }
        name: { type: string, example: GrowthX Solar }
        category: { type: string, example: Solar installers }
        summary: { type: string }
        availability: { type: string, enum: [available, coming_soon] }

    Plan:
      type: object
      required: [id, productSlug, name, description, price, interval, trialDays, features, highlighted]
      properties:
        id: { type: string }
        productSlug: { type: string, example: solar }
        name: { type: string, example: Growth }
        description: { type: string }
        price:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Price"
          description: "`null` for guests in `catalogue.plans` (prices go only to signed-in callers)."
        interval: { $ref: "#/components/schemas/BillingInterval" }
        trialDays: { type: integer, example: 14 }
        features:
          type: array
          items: { type: string }
        highlighted: { type: boolean }

    AdminPlan:
      allOf:
        - $ref: "#/components/schemas/Plan"
        - type: object
          required: [gstRate, active]
          properties:
            gstRate: { type: number, example: 18 }
            active: { type: boolean, description: "Whether the plan is on sale" }
            item: { type: string, nullable: true, description: "The billing Item on its invoices" }

    StaffRole:
      type: string
      enum: [admin, content_editor]

    StaffMember:
      type: object
      required: [id, email, name, role, enabled, signIn, isYou, hasOtherRoles]
      properties:
        id: { type: string, description: "The user id (their email)" }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/StaffRole" }
        enabled: { type: boolean }
        lastLogin: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        signIn:
          type: object
          required: [password, providers]
          properties:
            password: { type: boolean, description: "False until they set one (invite, Forgot password)" }
            providers:
              type: array
              items: { type: string, example: microsoft }
        isYou: { type: boolean }
        hasOtherRoles: { type: boolean, description: "Also a customer or partner: can't be disabled here" }

    SiteStatus:
      type: string
      enum: [requested, provisioning, ready, failed, suspended, archived]
      description: |
        requested: queued after sign-up. provisioning: Press is creating or configuring the site.
        ready: the site can be opened. failed: an admin has been alerted and will retry; the customer doesn't sign up again.
        suspended: payment failed after the grace period. archived: the subscription was cancelled.

    SiteRef:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/SiteStatus" }

    Site:
      type: object
      required: [id, productSlug, displayName, status, createdAt]
      properties:
        id: { type: string }
        productSlug: { type: string }
        origin: { type: string, enum: [provisioned, imported], description: "`imported`: the customer's own ERPNext site (ERPNext Direct), opened at its own /login" }
        displayName: { type: string, example: Noor Solar }
        status: { $ref: "#/components/schemas/SiteStatus" }
        statusMessage: { type: string, nullable: true, description: A customer-safe message. It never contains internal error detail. }
        subscriptionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time, nullable: true }

    ProvisioningStep:
      type: object
      required: [key, label, state]
      properties:
        key:
          type: string
          enum: [create_site, wait_for_site, install_apps, configure, health_check]
        label: { type: string, example: Installing apps }
        state: { type: string, enum: [pending, running, done, failed] }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    SiteSignInInfo:
      type: object
      required: [siteName, siteUrl, loginUrl]
      properties:
        siteName: { type: string, example: Abc Solar }
        siteUrl: { type: string, format: uri, example: "https://abc-solar.tbogrowthx.com" }
        loginUrl: { type: string, format: uri, description: "The site's own login page, for staff", example: "https://abc-solar.tbogrowthx.com/login" }
    CustomDomain:
      type: object
      description: A customer's own domain pointed at their site.
      required: [domain, status, records]
      properties:
        domain: { type: string, example: app.noorsolar.com }
        status:
          type: string
          enum: [pending_dns, verifying, active, failed]
          description: "`pending_dns`: waiting for the records; `verifying`: records found, HTTPS certificate being issued; `active`: live; `failed`: see `message` (remove the domain and add it again)"
        records:
          type: array
          description: The record options (add one of them). Shown until the domain is active; empty once it is.
          items:
            type: object
            required: [type, host, value, recommended]
            properties:
              type: { type: string, enum: [CNAME, A], description: "Add one of them, not both" }
              host: { type: string, description: "Name as most providers want it: `app` for app.noorsolar.com, `@` for the root domain", example: app }
              value: { type: string, description: "The site's address (CNAME) or the proxy's IP (A)", example: noor-solar.tbogrowthx.com }
              recommended: { type: boolean, description: "The CNAME for a subdomain; the A record for a root domain" }
        dnsProblem:
          type: string
          nullable: true
          enum: [not_found, wrong_target, multiple_records, aaaa_record, caa_blocks, cloudflare_proxied]
          description: |
            Why the last check failed, from Press's `check_dns`. `not_found`: no record yet; `wrong_target`: it points elsewhere;
            `multiple_records`: more than one CNAME or A record; `aaaa_record`: an IPv6 record exists; `caa_blocks`: a CAA record
            doesn't allow Let's Encrypt; `cloudflare_proxied`: behind Cloudflare's proxy (must be "DNS only"). Press reports a wrong target that runs a web
            server, or a wildcard (*) record, as proxied: Core says `wrong_target` unless the server is Cloudflare's. Null when fine, and when `failed`.
        message: { type: string, nullable: true, description: Safe to show the customer }
        checkedAt: { type: string, format: date-time, nullable: true }
        activeAt: { type: string, format: date-time, nullable: true }
    SiteDetail:
      allOf:
        - $ref: "#/components/schemas/Site"
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items: { $ref: "#/components/schemas/ProvisioningStep" }

    SubscriptionStatus:
      type: string
      enum: [trialing, active, past_due, suspended, canceled]

    Subscription:
      type: object
      required: [id, productName, planName, status, price, interval]
      properties:
        id: { type: string }
        productSlug: { type: string, nullable: true }
        planId: { type: string }
        productName: { type: string }
        planName: { type: string }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        price: { $ref: "#/components/schemas/Price" }
        interval: { $ref: "#/components/schemas/BillingInterval" }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: Null during a trial and for a `one_time` (lifetime) plan, which never expires.
        cancelAtPeriodEnd: { type: boolean, default: false }
        siteId: { type: string, nullable: true }

    InvoiceStatus:
      type: string
      enum: [draft, open, overdue, paid, void]
      description: "Mapped from ERPNext Sales Invoice: Draft→draft, Unpaid→open, Overdue→overdue, Paid→paid, Cancelled→void"

    Invoice:
      type: object
      required: [id, number, status, subtotal, tax, total, issuedAt]
      properties:
        id: { type: string }
        number: { type: string, example: GX/26-27/0001, description: "GST invoice number: GX/<financial year>/<sequence>, at most 16 characters" }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        subtotal: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money", description: "Total GST (CGST+SGST, or IGST)" }
        total: { $ref: "#/components/schemas/Money" }
        issuedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }

    IndianState:
      type: string
      description: State or union territory, as India Compliance names it
      enum:
        - Andaman and Nicobar Islands
        - Andhra Pradesh
        - Arunachal Pradesh
        - Assam
        - Bihar
        - Chandigarh
