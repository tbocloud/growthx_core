        new site. Billing only: nothing on the site changes. Terminated sites, sites without a
        subscription and canceled subscriptions can't change plan.
      operationId: adminAssignPlan
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
