                id: { type: string, description: "Plan id, e.g. laundry-growth" }
                product: { type: string, description: "GX Product slug" }
                planName: { type: string, example: Growth }
                interval: { $ref: "#/components/schemas/BillingInterval" }
                price: { type: integer, description: "In paise, e.g. 149900 for ₹1,499" }
                trialDays: { type: integer, default: 0 }
                gstIncluded: { type: boolean, default: false }
