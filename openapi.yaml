  /growthx_core.api.v1.referral.record_click:
    post:
      tags: [partner]
      summary: Record a visit to a referral link (website server only)
      description: |
        Called by the website's server when `/r/CODE` loads, after it has skipped link previews, bots and prefetches.
        No user token: it needs `X-GrowthX-Web-Key` (403 without a valid one), and the visitor's IP in
        `X-GrowthX-Client-IP`. Counts at most one click per code and visitor IP every 30 minutes; only a hash of the IP
        is kept. Always `202` with `counted`, also for an unknown or inactive code, so it can't be used to find codes.
        Make the call fire-and-forget with a short timeout.
      operationId: recordReferralClick
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 40, example: OKAFOR-7GB }
                landingPath: { type: string, maxLength: 200, example: /r/OKAFOR-7GB }
      responses:
        "202":
          description: Recorded, or not counted (duplicate, unknown or inactive code)
          content:
            application/json:
              schema:
                type: object
                required: [counted]
                properties:
                  counted: { type: boolean }
        "403":
          description: "`forbidden`: missing or wrong web key"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

