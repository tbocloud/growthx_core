  # ---------------------------------------------------------------- tenant (server to server)
  /growthx_core.api.v1.tenant.redeem_login:
    post:
      tags: [tenant]
      summary: Redeem an "Open my app" token (called by the tenant site, not by Web or Flutter)
      description: |
        Called by `growthx_theme.sso.login` on the customer's tenant site. The caller authenticates as the
        **tenant**, with its own key in `X-GX-Tenant-Key` (written to the tenant's site_config at provisioning;
        Core stores only its hash). Returns the user the tenant should log in.

        The token is single-use and expires 60 s after `customer.open_site` issued it. Redeeming always consumes
        it, even when it was issued for a different tenant, so a leaked link can't be retried elsewhere.
        Each redemption is audit-logged; the token itself is never logged.
        Rate-limited to 30 per minute per tenant key and 300 per minute per IP address.
      operationId: tenantRedeemLogin
      x-phase: 2
      security:
        - tenantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The `token` query parameter of the sign-in URL }
      responses:
        "200":
          description: Log this user in
          content:
            application/json:
              schema:
                type: object
                required: [email, fullName]
                properties:
                  email: { type: string, format: email, example: sana@rahimsun.example }
                  fullName: { type: string, example: Sana Rahim }
        "401":
          description: "`invalid_tenant_key`: the key is missing or belongs to no tenant"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            `invalid_login_token`: the token is unknown, expired or already used, was issued for another tenant,
            or the user or tenant is no longer active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    tenantKey:
      type: apiKey
      in: header
      name: X-GX-Tenant-Key
      description: |
        A tenant site's own secret (`gxt_…`), written to its site_config as `growthx_tenant_key` during
        provisioning. Used only by tenant sites calling `tenant.*` endpoints.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque access token from `auth.login`, `auth.signup` or `auth.refresh`. It lasts 1 hour.
        Refresh tokens last 30 days and rotate on every use. Logging out, resetting the password or disabling
        the user revokes the tokens. An expired or revoked token returns 401 `unauthenticated`.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Id:
      name: id
      in: query
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A UUID chosen by the client. Reusing the same key within 24 h returns the original response.
      schema: { type: string, format: uuid }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, enum: [true] }
    Unauthenticated:
      description: "`unauthenticated`: no token, or the token is expired or revoked"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden`: the user's role can't call this endpoint"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: the resource doesn't exist or doesn't belong to the caller"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: "`validation_failed`: the request is invalid; see `fields`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`: too many requests. The `Retry-After` header gives the number of seconds to wait."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentUnavailable:
      description: "`payment_unavailable`: the payment gateway is not configured or not reachable. Show a friendly message and let the user try later."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: "`internal_error`: show a friendly message together with `reference`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable code. Current list: unauthenticated, invalid_credentials, invalid_token, forbidden,
                not_found, validation_failed, email_taken, invalid_plan, invalid_reset_key,
                payment_verification_failed, payment_unavailable, site_not_ready, not_retryable,
                slot_taken, expert_busy, not_changeable, not_started,
                idempotency_conflict, rate_limited, bad_request, method_not_allowed, invalid_tenant_key,
                invalid_login_token, internal_error. Proposed: duplicate_lead, invalid_otp.
              example: email_taken
            message: { type: string, example: An account with this email already exists. }
            fields:
              type: object
              additionalProperties: { type: string }
              example: { email: An account with this email already exists. }
            reference: { type: string, description: Support reference (5xx responses only) }

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor units (paise), example: 149900 }
        currency: { type: string, enum: [INR] }

    Price:
      allOf:
        - $ref: "#/components/schemas/Money"
        - type: object
          required: [gstIncluded]
          properties:
            gstIncluded: { type: boolean, description: Whether `amount` already includes GST }

    BillingInterval:
      type: string
      enum: [month, year]

    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
      description: Which client is logging in. It is recorded with the token so it can be revoked per client.

    Role:
      type: string
      enum: [customer, partner, admin]

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string, example: Amina Noor }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        company: { type: string, nullable: true, example: Noor Solar }
        partnerStatus:
          type: string
          enum: [pending_approval, active, suspended]
          nullable: true
          description: Set only for partners

    ProvisioningHealth:
      type: object
      required: [status, problems, sites, jobs, scheduler, checkedAt]
      properties:
        status: { type: string, enum: [ok, alert] }
        problems:
          type: array
          items: { type: string, enum: [failed_sites, stuck_sites, no_workers, queue_unreachable, scheduler_not_running] }
        sites:
          type: object
          required: [failed, stuck]
          properties:
            failed: { type: integer }
            stuck: { type: integer }
        jobs:
          type: object
          nullable: true
          description: "Core's site-creation jobs on the `long` queue; null if Redis can't be reached"
          properties:
            queued: { type: integer }
            running: { type: integer }
            failedLast24h: { type: integer, description: "Jobs that crashed (e.g. timed out); the site then shows as stuck" }
            workers: { type: integer, description: Workers on the long queue }
        scheduler:
          type: object
          properties:
            active: { type: boolean }
            lastRun: { type: string, format: date-time, nullable: true, description: "Last run of resume_pending" }
        checkedAt: { type: string, format: date-time }

    AuthSession:
      type: object
      required: [accessToken, expiresAt, refreshToken, refreshExpiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Product:
      type: object
      required: [id, slug, name, category, summary, availability]
      properties:
        id: { type: string }
        slug: { type: string, example: solar }
        name: { type: string, example: GrowthX Solar }
        category: { type: string, example: Solar installers }
        summary: { type: string }
        availability: { type: string, enum: [available, coming_soon] }

    Plan:
      type: object
      required: [id, productSlug, name, description, price, interval, trialDays, features, highlighted]
      properties:
        id: { type: string }
        productSlug: { type: string, example: solar }
        name: { type: string, example: Growth }
        description: { type: string }
        price: { $ref: "#/components/schemas/Price" }
        interval: { $ref: "#/components/schemas/BillingInterval" }
        trialDays: { type: integer, example: 14 }
        features:
          type: array
          items: { type: string }
        highlighted: { type: boolean }

    SiteStatus:
      type: string
      enum: [requested, provisioning, ready, failed, suspended, archived]
      description: |
        requested: queued after sign-up. provisioning: Press is creating or configuring the site.
        ready: the site can be opened. failed: an admin has been alerted and will retry; the customer doesn't sign up again.
        suspended: payment failed after the grace period. archived: the subscription was cancelled.

    SiteRef:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/SiteStatus" }

    Site:
      type: object
      required: [id, productSlug, displayName, status, createdAt]
      properties:
        id: { type: string }
        productSlug: { type: string }
        displayName: { type: string, example: Noor Solar }
        status: { $ref: "#/components/schemas/SiteStatus" }
        statusMessage: { type: string, nullable: true, description: A customer-safe message. It never contains internal error detail. }
        subscriptionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time, nullable: true }

    ProvisioningStep:
      type: object
      required: [key, label, state]
      properties:
        key:
          type: string
          enum: [create_site, wait_for_site, install_apps, configure, health_check]
        label: { type: string, example: Installing apps }
        state: { type: string, enum: [pending, running, done, failed] }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    SiteDetail:
      allOf:
        - $ref: "#/components/schemas/Site"
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items: { $ref: "#/components/schemas/ProvisioningStep" }

    SubscriptionStatus:
      type: string
      enum: [trialing, active, past_due, suspended, canceled]

    Subscription:
      type: object
      required: [id, productName, planName, status, price, interval]
      properties:
        id: { type: string }
        productName: { type: string }
        planName: { type: string }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        price: { $ref: "#/components/schemas/Price" }
        interval: { $ref: "#/components/schemas/BillingInterval" }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean, default: false }
        siteId: { type: string, nullable: true }

    InvoiceStatus:
      type: string
      enum: [draft, open, overdue, paid, void]
      description: "Mapped from ERPNext Sales Invoice: Draft→draft, Unpaid→open, Overdue→overdue, Paid→paid, Cancelled→void"

    Invoice:
      type: object
      required: [id, number, status, subtotal, tax, total, issuedAt]
      properties:
        id: { type: string }
        number: { type: string, example: GX-2026-00412 }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        subtotal: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money", description: "Total GST (CGST+SGST, or IGST)" }
        total: { $ref: "#/components/schemas/Money" }
        issuedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }

    PaymentProvider:
      type: string
      enum: [razorpay]
      description: The gateway the server chose. More gateways can be added without a contract change.

    CheckoutSession:
      type: object
      required: [provider, reference, publicKey, plan, amount, description, prefill]
      properties:
        provider: { $ref: "#/components/schemas/PaymentProvider" }
        reference: { type: string, description: Gateway subscription or order id, example: sub_NgQ8kTgV5bE2xY }
        publicKey: { type: string, description: Public key only, example: rzp_live_XXXXXXXXXXXX }
        plan:
          type: object
          required: [id, name, interval]
          properties:
            id: { type: string }
            name: { type: string }
            interval: { $ref: "#/components/schemas/BillingInterval" }
        amount: { $ref: "#/components/schemas/Price" }
        description: { type: string, example: GrowthX Growth — billed yearly }
        prefill:
          type: object
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }

    PartnerSummary:
      type: object
      required: [referralCode, referralUrl, activeCustomers, referredSignups, monthlyRecurringCommission, pendingPayout]
      properties:
        referralCode: { type: string, example: OKAFOR-7Q2 }
        referralUrl: { type: string, format: uri, description: "Use this for the share link and the QR code: the website's welcome page, {growthx_web_url}/r/{code}" }
        activeCustomers: { type: integer }
        referredSignups: { type: integer }
        openLeads: { type: integer, nullable: true, description: Null until lead tracking is agreed (§2.4) }
        monthlyRecurringCommission: { $ref: "#/components/schemas/Money" }
        pendingPayout: { $ref: "#/components/schemas/Money" }

    # ---------------------------------------------------------------- partner app (PROPOSED)
    PartnerDashboard:
      description: "`PartnerSummary` plus the app's home-screen extras"
      allOf:
        - $ref: "#/components/schemas/PartnerSummary"
        - type: object
          required: [earnings, newCustomersThisMonth, trialsEndingNext7Days, unreadNotifications, recentCustomers, recentCommissions]
          properties:
            earnings: { $ref: "#/components/schemas/PartnerEarnings" }
            newCustomersThisMonth: { type: integer }
            trialsEndingNext7Days: { type: integer }
            unreadNotifications: { type: integer }
            recentCustomers:
              type: array
              items: { $ref: "#/components/schemas/PartnerCustomer" }
            recentCommissions:
              type: array
              items: { $ref: "#/components/schemas/Commission" }

    PartnerCustomer:
      description: "A customer attributed to the partner. `city` is null until sign-up collects it; `source.type` is `referral_link` until campaigns and leads exist."
      type: object
      required: [id, businessName, subscriptionStatus, siteActive, joinedAt, source]
      properties:
        id: { type: string }
        businessName: { type: string, example: Noor Solar }
        contactName: { type: string, nullable: true, example: Amina Noor }
        phone: { type: string, nullable: true, description: "Shown so the partner can follow up. Confirm with Sammish (privacy)." }
        email: { type: string, format: email, nullable: true }
        city: { type: string, nullable: true }
        productSlug: { type: string, nullable: true, example: solar }
        plan:
          type: object
          nullable: true
          required: [id, name, interval, price]
          properties:
            id: { type: string, example: solar-growth-month }
            name: { type: string, example: Growth }
            interval: { $ref: "#/components/schemas/BillingInterval" }
            price: { $ref: "#/components/schemas/Price" }
        subscriptionStatus: { $ref: "#/components/schemas/SubscriptionStatus" }
        siteActive: { type: boolean, description: The customer's ERP site is ready and not suspended }
        joinedAt: { type: string, format: date-time }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        renewsAt: { type: string, format: date-time, nullable: true }
        source:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [referral_link, campaign, lead] }
            campaignId: { type: string, nullable: true }

    PartnerCustomerDetail:
      allOf:
        - $ref: "#/components/schemas/PartnerCustomer"
        - type: object
          required: [timeline, commissions]
          properties:
            timeline:
              type: array
              description: Oldest first
              items:
                type: object
                required: [at, event]
                properties:
                  at: { type: string, format: date-time }
                  event: { type: string, enum: [signed_up, trial_started, site_ready, paid, renewed, payment_failed, suspended, canceled] }
                  description: { type: string, nullable: true }
            commissions:
              type: array
              items: { $ref: "#/components/schemas/Commission" }

    ReferralStats:
      type: object
      required: [from, to, signups, conversions]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        clicks: { type: integer, nullable: true, description: Null until the website tracks link visits }
        signups: { type: integer }
        conversions: { type: integer }
        conversionRate: { type: number, nullable: true, description: conversions / signups (0 to 1). Null when signups is 0. }

    CampaignStatus:
      type: string
      enum: [scheduled, active, paused, ended]

    Campaign:
      type: object
      required: [id, name, code, url, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        code: { type: string, example: OFFER25 }
        offer: { type: string, nullable: true, description: "What the customer gets, as display text" }
        url: { type: string, format: uri, description: This partner's link for the campaign. Use it for share and QR. }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        stats:
          type: object
          properties:
            clicks: { type: integer, nullable: true }
            signups: { type: integer }
            conversions: { type: integer }

    LeadStatus:
      type: string
      enum: [new, contacted, demo_scheduled, converted, lost]
      description: "`converted` is set by the server when the lead signs up. Show `lost` as \"Not interested\"."

    LeadPatch:
      type: object
      properties:
        contactName: { type: string, maxLength: 140 }
        businessName: { type: string, maxLength: 140 }
        phone: { type: string, example: "+919846033412" }
        email: { type: string, format: email }
        city: { type: string, maxLength: 140 }
        productSlug: { type: string, example: solar }
        interestedPlanId: { type: string, example: solar-growth-month }
        notes: { type: string, maxLength: 2000 }

    LeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadPatch"
        - type: object
          required: [contactName, businessName, phone]

    PartnerLead:
      allOf:
        - $ref: "#/components/schemas/LeadPatch"
        - type: object
          required: [id, contactName, businessName, phone, status, createdAt, updatedAt]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/LeadStatus" }
            customerId: { type: string, nullable: true, description: Set once the lead signs up }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PartnerEarnings:
      description: "All amounts calculated on the server. Placeholder figures until the commission rules are decided (D8)."
      type: object
      required: [thisMonth, lastMonth, pending, approved, paidLifetime, lifetimeTotal]
      properties:
        thisMonth: { $ref: "#/components/schemas/Money" }
        lastMonth: { $ref: "#/components/schemas/Money" }
        pending: { $ref: "#/components/schemas/Money", description: Under review }
        approved: { $ref: "#/components/schemas/Money", description: "Approved, not yet paid" }
        paidLifetime: { $ref: "#/components/schemas/Money" }
        lifetimeTotal: { $ref: "#/components/schemas/Money" }
        nextPayoutDate: { type: string, format: date, nullable: true }
        tdsRate: { type: number, nullable: true, description: "e.g. 0.02 for 2 %. Display only; TDS is calculated on the server." }

    CommissionStatus:
      type: string
      enum: [pending, approved, paid, reversed]
      description: "Show `pending` as \"Under review\". `reversed`: the customer was refunded."

    CommissionType:
      type: string
      enum: [first_month, recurring, bonus]

    Commission:
      type: object
      required: [id, type, amount, status, earnedAt]
      properties:
        id: { type: string }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true, example: Noor Solar }
        invoiceId: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/CommissionType" }
        base: { $ref: "#/components/schemas/Money", description: Amount the commission is calculated on }
        rate: { type: number, nullable: true, description: "e.g. 0.2 for 20 %" }
        amount: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/CommissionStatus" }
        earnedAt: { type: string, format: date-time }
        reviewUntil: { type: string, format: date-time, nullable: true }
        payoutId: { type: string, nullable: true }

    PayoutStatus:
      type: string
      enum: [processing, paid, failed]

    PayoutMethod:
      description: Always masked
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bank, upi] }
        bankName: { type: string, nullable: true, example: HDFC Bank }
        accountLast4: { type: string, nullable: true, example: "7812" }
        ifsc: { type: string, nullable: true }
        upiId: { type: string, nullable: true, description: "Masked, e.g. pa****@okhdfc" }

    Payout:
      type: object
      required: [id, reference, period, status, gross, tds, net]
      properties:
        id: { type: string }
        reference: { type: string, example: GXP-2026-0318 }
        period: { type: string, pattern: "^\\d{4}-\\d{2}$", example: 2026-09 }
        status: { $ref: "#/components/schemas/PayoutStatus" }
        paidAt: { type: string, format: date-time, nullable: true }
        method: { allOf: [{ $ref: "#/components/schemas/PayoutMethod" }], nullable: true }
        gross: { $ref: "#/components/schemas/Money" }
        tds: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }

    PayoutDetail:
      allOf:
        - $ref: "#/components/schemas/Payout"
        - type: object
          required: [commissions]
          properties:
            commissions:
              type: array
              items: { $ref: "#/components/schemas/Commission" }

    NotificationCategory:
      type: string
      enum: [commission, payout, customer, trial, lead, account]

    PartnerNotification:
      type: object
      required: [id, category, title, body, createdAt]
      properties:
        id: { type: string }
        category: { $ref: "#/components/schemas/NotificationCategory" }
        title: { type: string, example: Commission earned }
        body: { type: string, example: Your commission is under review. }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        deepLink:
          type: object
          nullable: true
          description: Where tapping goes. The app maps `type` to its own route.
          required: [type]
          properties:
            type: { type: string, enum: [customer, lead, commission, payout, earnings, profile] }
            id: { type: string, nullable: true }

    NotificationPreferences:
      type: object
      properties:
        commissions: { type: boolean }
        newCustomers: { type: boolean }
        trialReminders: { type: boolean }
        productUpdates: { type: boolean }

    PartnerProfile:
      type: object
      required: [id, name, email, status, referralCode, memberSince]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        company: { type: string, nullable: true }
        gstin: { type: string, nullable: true }
        panMasked: { type: string, nullable: true, example: ABCDE****F }
        tier: { type: string, nullable: true, example: Silver Partner, description: "Display label; tiers are pending D8" }
        status: { type: string, enum: [pending_approval, active, suspended] }
        referralCode: { type: string }
        memberSince: { type: string, format: date }
        payoutMethod: { allOf: [{ $ref: "#/components/schemas/PayoutMethod" }], nullable: true }

    AdminSummary:
      type: object
      required: [mrr, activeCustomers, trialCustomers, suspendedCustomers, activePartners]
      properties:
        mrr: { $ref: "#/components/schemas/Money", description: Excludes GST }
        activeCustomers: { type: integer }
        trialCustomers: { type: integer }
        suspendedCustomers: { type: integer }
        activePartners: { type: integer }

    CustomerStatus:
      type: string
      enum: [trial, active, suspended, churned]

    AdminCustomer:
      type: object
      required: [id, company, contactEmail, status, createdAt]
      properties:
        id: { type: string }
        company: { type: string }
        contactEmail: { type: string, format: email }
        status: { $ref: "#/components/schemas/CustomerStatus" }
        plan: { type: string, nullable: true }
        partnerName: { type: string, nullable: true }
        mrr: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    AdminTenant:
      type: object
      required: [id, customerId, customerName, productSlug, status, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        productSlug: { type: string }
        siteUrl: { type: string, format: uri, nullable: true }
        status: { $ref: "#/components/schemas/SiteStatus" }
        lastError: { type: string, nullable: true, description: Admin-only detail }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminTenantDetail:
      allOf:
        - $ref: "#/components/schemas/AdminTenant"
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ProvisioningStep"
                  - type: object
                    properties:
                      attempt: { type: integer }
                      error: { type: string, nullable: true }

    AppointmentStatus:
      type: string
      enum: [confirmed, completed, cancelled, no_show]

    VisitorAppointment:
      type: object
      required: [id, status, start, end, name, canChange]
      properties:
        id: { type: string, example: GXA-00001 }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        name: { type: string }
        meetingUrl: { type: string, format: uri, nullable: true }
        canChange: { type: boolean, description: True while the booking is confirmed and the call hasn't started }

    AdminAppointment:
      type: object
      required: [id, status, start, end, name, email, phone, createdAt]
      properties:
        id: { type: string, example: GXA-00001 }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string, nullable: true }
        app: { type: string, nullable: true, description: Product slug }
        notes: { type: string, nullable: true, description: What the visitor wrote }
        expert: { type: string, format: email, nullable: true }
        meetingUrl: { type: string, format: uri, nullable: true }
        leadId: { type: string, nullable: true, description: ERPNext Lead }
        createdAt: { type: string, format: date-time }

    AdminAppointmentDetail:
      allOf:
        - $ref: "#/components/schemas/AdminAppointment"
        - type: object
          required: [history]
          properties:
            adminNotes: { type: string, nullable: true, description: Internal; never shown to the visitor }
            cancelledBy: { type: string, enum: [visitor, team], nullable: true }
            cancelReason: { type: string, nullable: true }
            history:
              type: array
              items:
                type: object
                required: [at, actor, action]
                properties:
                  at: { type: string, format: date-time }
                  actor: { type: string, description: "User id, or Guest for the visitor" }
                  action: { type: string, example: reschedule }
                  details: { type: string, nullable: true }
