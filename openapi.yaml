    BillingAddress:
      type: object
      required: [addressLine1, addressLine2, city, state, pincode, country]
      properties:
        addressLine1: { type: string, maxLength: 140, example: "2nd Floor, Lulu Cyber Tower" }
        addressLine2: { type: string, maxLength: 140, nullable: true, example: Infopark }
        city: { type: string, maxLength: 140, example: Kochi }
        state: { $ref: "#/components/schemas/IndianState" }
        pincode: { type: string, pattern: "^[1-9][0-9]{5}$", example: "682042" }
        country: { type: string, enum: [India], description: Billing addresses in India only for now }

    BillingDetails:
      type: object
      required: [complete, billingName, address, gstin, gstCategory]
      properties:
        complete: { type: boolean, description: "False until a billing address is saved; checkout needs it" }
        billingName:
          type: string
          nullable: true
          example: Asha Prints Private Limited
          description: The customer name on invoices; null means the account's company name
        address:
          allOf: [{ $ref: "#/components/schemas/BillingAddress" }]
          nullable: true
        gstin: { type: string, nullable: true, example: 32AAVFT5109L1ZQ }
        gstCategory:
          type: string
          enum: [registered, unregistered]
          nullable: true
          description: "registered (Registered Regular) with a GSTIN, unregistered without; null while incomplete"

    BillingDetailsInput:
      type: object
      required: [billingName, addressLine1, addressLine2, city, state, pincode, gstin]
      properties:
        billingName:
          type: string
          minLength: 1
          maxLength: 140
          nullable: true
          description: "Name on the invoice, e.g. the legal name on the GST registration; null for the account's company name"
        addressLine1: { type: string, minLength: 1, maxLength: 140 }
        addressLine2: { type: string, maxLength: 140, nullable: true }
        city: { type: string, minLength: 1, maxLength: 140 }
        state: { $ref: "#/components/schemas/IndianState" }
        pincode: { type: string, pattern: "^[1-9][0-9]{5}$" }
        gstin:
          type: string
          nullable: true
          pattern: "^[0-9]{2}[A-Z0-9]{13}$"
          description: Optional (null for none). Send upper case without spaces; anything else is a 422.

    PaymentProvider:
      type: string
      enum: [payu]
      description: The gateway the server chose.

    CheckoutSession:
      type: object
      required: [provider, reference, plan, amount, invoice, description, prefill, redirect]
      properties:
        provider: { $ref: "#/components/schemas/PaymentProvider" }
        reference: { type: string, description: The checkout's id in Core, example: GXO-00001 }
        plan:
          type: object
          required: [id, name, interval]
          properties:
            id: { type: string }
            name: { type: string }
            interval: { $ref: "#/components/schemas/BillingInterval" }
        amount:
          allOf: [{ $ref: "#/components/schemas/Price" }]
          description: What the customer pays (the invoice total, GST included)
        invoice: { $ref: "#/components/schemas/Invoice" }
        description: { type: string, example: GrowthX Solar Lifetime }
        prefill:
          type: object
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        redirect:
          type: object
          required: [url, method, fields]
          description: Submit `fields` to `url` as a regular HTML form (hidden inputs, method POST) in the same tab
          properties:
            url: { type: string, format: uri, example: https://test.payu.in/_payment }
            method: { type: string, enum: [POST] }
            fields:
              type: object
              additionalProperties: { type: string }
              description: PayU's form fields, hash included. Post them exactly as given.

    CheckoutStatus:
      type: object
      required: [reference, status, plan, invoice, subscription]
      properties:
        reference: { type: string, example: GXO-00001 }
        status: { type: string, enum: [pending, paid, failed, attention, reversed] }
        plan:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        invoice:
          allOf: [{ $ref: "#/components/schemas/Invoice" }]
          nullable: true
        subscription:
          allOf: [{ $ref: "#/components/schemas/Subscription" }]
          nullable: true
          description: Set when `status` is `paid`

    PartnerSummary:
      type: object
      required: [referralCode, referralUrl, activeCustomers, referredSignups, monthlyRecurringCommission, pendingPayout]
      properties:
        referralCode: { type: string, example: OKAFOR-7Q2 }
        referralUrl: { type: string, format: uri, description: "Use this for the share link and the QR code: the website's welcome page, {growthx_web_url}/r/{code}" }
        activeCustomers: { type: integer }
        referredSignups: { type: integer }
        openLeads: { type: integer, nullable: true, description: Null until lead tracking is agreed (§2.4) }
        monthlyRecurringCommission: { $ref: "#/components/schemas/Money" }
        pendingPayout: { $ref: "#/components/schemas/Money" }

    # ---------------------------------------------------------------- partner app (PROPOSED)
    PartnerDashboard:
      description: "`PartnerSummary` plus the app's home-screen extras"
      allOf:
        - $ref: "#/components/schemas/PartnerSummary"
        - type: object
          required: [earnings, newCustomersThisMonth, trialsEndingNext7Days, unreadNotifications, recentCustomers, recentCommissions]
          properties:
            earnings: { $ref: "#/components/schemas/PartnerEarnings" }
            newCustomersThisMonth: { type: integer }
            trialsEndingNext7Days: { type: integer }
            unreadNotifications: { type: integer }
            recentCustomers:
              type: array
              items: { $ref: "#/components/schemas/PartnerCustomer" }
            recentCommissions:
              type: array
              items: { $ref: "#/components/schemas/Commission" }

    PartnerCustomer:
      description: "A customer attributed to the partner. `city` is null until sign-up collects it; `source.type` is `referral_link` until campaigns and leads exist."
      type: object
      required: [id, businessName, subscriptionStatus, siteActive, joinedAt, source]
      properties:
        id: { type: string }
        businessName: { type: string, example: Noor Solar }
        contactName: { type: string, nullable: true, example: Amina Noor }
        city: { type: string, nullable: true }
        productSlug: { type: string, nullable: true, example: solar }
        plan:
          type: object
          nullable: true
          required: [id, name, interval, price]
          properties:
            id: { type: string, example: solar-growth-month }
            name: { type: string, example: Growth }
            interval: { $ref: "#/components/schemas/BillingInterval" }
            price: { $ref: "#/components/schemas/Price" }
        subscriptionStatus: { $ref: "#/components/schemas/SubscriptionStatus" }
        siteActive: { type: boolean, description: The customer's ERP site is ready and not suspended }
        joinedAt: { type: string, format: date-time }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        renewsAt: { type: string, format: date-time, nullable: true }
        source:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [referral_link, campaign, lead] }
            campaignId: { type: string, nullable: true }

    PartnerCustomerDetail:
      allOf:
        - $ref: "#/components/schemas/PartnerCustomer"
        - type: object
          required: [timeline, commissions]
          properties:
            timeline:
              type: array
              description: Oldest first
              items:
                type: object
                required: [at, event]
                properties:
                  at: { type: string, format: date-time }
                  event: { type: string, enum: [signed_up, trial_started, site_ready, paid, renewed, payment_failed, suspended, canceled] }
                  description: { type: string, nullable: true }
            commissions:
              type: array
              items: { $ref: "#/components/schemas/Commission" }

    ReferralStats:
      type: object
      required: [from, to, signups, conversions]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        clicks: { type: integer, nullable: true, description: "Referral link visits in the range, as recorded by `referral.record_click`" }
        signups: { type: integer }
        conversions: { type: integer }
        conversionRate: { type: number, nullable: true, description: conversions / signups (0 to 1). Null when signups is 0. }

    CampaignStatus:
      type: string
      enum: [scheduled, active, paused, ended]

    Campaign:
      type: object
      required: [id, name, code, url, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        code: { type: string, example: OFFER25 }
        offer: { type: string, nullable: true, description: "What the customer gets, as display text" }
        url: { type: string, format: uri, description: This partner's link for the campaign. Use it for share and QR. }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        stats:
          type: object
          properties:
            clicks: { type: integer, nullable: true }
            signups: { type: integer }
            conversions: { type: integer }

    LeadStatus:
      type: string
      enum: [new, contacted, demo_scheduled, converted, lost]
      description: "`converted` is set by the server when the lead signs up. Show `lost` as \"Not interested\"."

    LeadPatch:
      type: object
      properties:
        contactName: { type: string, maxLength: 140 }
        businessName: { type: string, maxLength: 140 }
        phone: { type: string, example: "+919846033412" }
        email: { type: string, format: email }
        city: { type: string, maxLength: 140 }
        productSlug: { type: string, example: solar }
        interestedPlanId: { type: string, example: solar-growth-month }
        notes: { type: string, maxLength: 2000 }

    LeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadPatch"
        - type: object
          required: [contactName, businessName, phone]

    PartnerLead:
      allOf:
        - $ref: "#/components/schemas/LeadPatch"
        - type: object
          required: [id, contactName, businessName, phone, status, createdAt, updatedAt]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/LeadStatus" }
            customerId: { type: string, nullable: true, description: Set once the lead signs up }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PartnerEarnings:
      description: "All amounts calculated on the server, from the commission ledger. Commission is before TDS."
      type: object
      required: [thisMonth, lastMonth, pending, approved, paidLifetime, lifetimeTotal]
      properties:
        thisMonth: { $ref: "#/components/schemas/Money" }
        lastMonth: { $ref: "#/components/schemas/Money" }
        pending: { $ref: "#/components/schemas/Money", description: Under review }
        approved: { $ref: "#/components/schemas/Money", description: "Approved, not yet paid" }
        paidLifetime: { $ref: "#/components/schemas/Money" }
        lifetimeTotal: { $ref: "#/components/schemas/Money" }
        nextPayoutDate: { type: string, format: date, nullable: true }
        tdsRate: { type: number, nullable: true, description: "e.g. 0.02 for 2 %. Display only; TDS is calculated on the server." }
        minimumPayout: { $ref: "#/components/schemas/Money", description: "Approved, unpaid commission needed before a payout is made (before TDS)" }
        commissionRate: { type: number, description: "The partner's current rate, e.g. 0.2 for 20 %" }
        tier: { type: string, description: "The partner's current tier, e.g. Seed" }

    CommissionStatus:
      type: string
      enum: [pending, approved, paid, reversed]
      description: "Show `pending` as \"Under review\". `reversed`: the payment was refunded or cancelled (admins see `void`)."

    CommissionType:
      type: string
      enum: [first_month, recurring, bonus]

    Commission:
      type: object
      required: [id, type, amount, status, earnedAt]
      properties:
        id: { type: string }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true, example: Noor Solar }
        invoiceId: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/CommissionType" }
        base: { $ref: "#/components/schemas/Money", description: Amount the commission is calculated on }
        rate: { type: number, nullable: true, description: "e.g. 0.2 for 20 %" }
        amount: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/CommissionStatus" }
        earnedAt: { type: string, format: date-time }
        reviewUntil: { type: string, format: date-time, nullable: true }
        payoutId: { type: string, nullable: true }

    PayoutStatus:
      type: string
      enum: [processing, paid, failed]

    PayoutMethod:
      description: Always masked
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bank, upi] }
        bankName: { type: string, nullable: true, example: HDFC Bank }
        accountLast4: { type: string, nullable: true, example: "7812" }
        ifsc: { type: string, nullable: true }
        upiId: { type: string, nullable: true, description: "Masked, e.g. pa****@okhdfc" }

    Payout:
      type: object
      required: [id, reference, period, status, gross, tds, net]
      properties:
        id: { type: string }
        reference: { type: string, nullable: true, example: UTR123456789, description: "Bank or UPI reference, set once the payout is paid" }
        period: { type: string, pattern: "^\\d{4}-\\d{2}$", example: 2026-09 }
        status: { $ref: "#/components/schemas/PayoutStatus" }
        paidAt: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [bank_transfer, upi, other], nullable: true }
        commissionCount: { type: integer }
        tdsRate: { type: number, description: "e.g. 0.02 for 2 %, as applied to this payout" }
        gross: { $ref: "#/components/schemas/Money" }
        tds: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }

    PayoutDetail:
      allOf:
        - $ref: "#/components/schemas/Payout"
        - type: object
          required: [commissions]
          properties:
            commissions:
              type: array
              items: { $ref: "#/components/schemas/Commission" }

    NotificationCategory:
      type: string
      enum: [commission, payout, customer, trial, lead, account]

    PartnerNotification:
      type: object
      required: [id, category, title, body, createdAt]
      properties:
        id: { type: string }
        category: { $ref: "#/components/schemas/NotificationCategory" }
        title: { type: string, example: Commission earned }
        body: { type: string, example: Your commission is under review. }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        deepLink:
          type: object
          nullable: true
          description: Where tapping goes. The app maps `type` to its own route.
          required: [type]
          properties:
            type: { type: string, enum: [customer, lead, commission, payout, earnings, profile] }
            id: { type: string, nullable: true }

    NotificationPreferences:
      type: object
      properties:
        commissions: { type: boolean }
        newCustomers: { type: boolean }
        trialReminders: { type: boolean }
        productUpdates: { type: boolean }

    PartnerProfile:
      type: object
      required: [id, name, email, status, referralCode, memberSince]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        company: { type: string, nullable: true }
        gstin: { type: string, nullable: true }
        panMasked: { type: string, nullable: true, example: ABCDE****F }
        tier: { type: string, nullable: true, example: Silver Partner, description: "Display label; tiers are pending D8" }
        status: { type: string, enum: [pending_approval, active, suspended] }
        referralCode: { type: string }
        memberSince: { type: string, format: date }
        payoutMethod: { allOf: [{ $ref: "#/components/schemas/PayoutMethod" }], nullable: true }

    AdminSummary:
      type: object
      required: [mrr, activeCustomers, trialCustomers, suspendedCustomers, activePartners]
      properties:
        mrr: { $ref: "#/components/schemas/Money", description: "Excludes GST. One-time (lifetime) payments count 0." }
        activeCustomers: { type: integer }
        trialCustomers: { type: integer }
        suspendedCustomers: { type: integer }
        activePartners: { type: integer }

    CustomerStatus:
      type: string
      enum: [trial, active, suspended, churned]

    PartnerStatus:
      type: string
      enum: [pending_approval, active, suspended]

    AdminCommission:
      description: "A commission as an admin sees it. Like `Commission`, but a refunded one is `void` (not `reversed`)."
      type: object
      required: [id, type, amount, status, earnedAt, partnerId]
      properties:
        id: { type: string }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        invoiceId: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/CommissionType" }
        base: { $ref: "#/components/schemas/Money", description: Amount excluding GST the commission is calculated on }
        rate: { type: number, nullable: true, description: "e.g. 0.2 for 20 %" }
        amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [pending, approved, paid, void] }
        earnedAt: { type: string, format: date-time, description: When the customer paid }
        reviewUntil: { type: string, format: date-time, nullable: true, description: "Earliest approval (hold period), while pending" }
        payoutId: { type: string, nullable: true }
        partnerId: { type: string }
        partnerName: { type: string, nullable: true }
        tier: { type: string, nullable: true }
        activeClients: { type: integer, description: "Partner's active clients when the customer paid" }
        approvedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AdminPayout:
      description: A payout as an admin sees it (`draft` until paid, `cancelled` if dropped).
      type: object
      required: [id, reference, period, status, gross, tds, net, partnerId]
      properties:
        id: { type: string }
        reference: { type: string, nullable: true, description: "Bank or UPI reference, set once paid" }
        period: { type: string, pattern: "^\\d{4}-\\d{2}$" , example: 2026-09 }
        status: { type: string, enum: [draft, paid, cancelled] }
        paidAt: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [bank_transfer, upi, other], nullable: true }
        commissionCount: { type: integer }
        tdsRate: { type: number, description: "e.g. 0.02 for 2 %, as applied to this payout" }
        gross: { $ref: "#/components/schemas/Money" }
        tds: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        partnerId: { type: string }
        partnerName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    BulkCommissionResult:
      type: object
      required: [updated, ids, skipped]
      properties:
        updated: { type: integer }
        ids: { type: array, items: { type: string } }
        skipped:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string }
              reason: { type: string, example: on_hold }

    AdminPartner:
      type: object
      required: [id, name, email, referralCode, status, joinedAt, referredCustomers, payingCustomers, mrr]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        company: { type: string, nullable: true }
        referralCode: { type: string, example: OKAFOR-7GB }
        status: { $ref: "#/components/schemas/PartnerStatus" }
        tier: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
        referredCustomers: { type: integer, description: All customers who signed up with their code }
        payingCustomers: { type: integer, description: Referred customers with status active (not trial) }
        mrr: { $ref: "#/components/schemas/Money", description: "Referred customers' active subscriptions, monthly, excluding GST" }

    AdminPartnerDetail:
      allOf:
        - $ref: "#/components/schemas/AdminPartner"
        - type: object
          required: [customers, history]
          properties:
            phone: { type: string, nullable: true }
            city: { type: string, nullable: true }
            gstin: { type: string, nullable: true }
            customers:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  company: { type: string }
                  contactEmail: { type: string }
                  status: { $ref: "#/components/schemas/CustomerStatus" }
                  plan: { type: string, nullable: true }
                  mrr: { $ref: "#/components/schemas/Money" }
                  createdAt: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  actor: { type: string }
                  action: { type: string, enum: [approve, suspend, reactivate] }
                  details: { type: string, example: "active → suspended: Spam referrals" }

    ContactRequestSource:
      type: string
      enum: [contact, support]
      description: "`contact`: the public Contact form. `support`: the signed-in customer Support page."

    AdminContactRequest:
      type: object
      required: [id, name, email, company, message, source, customerId, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: string, nullable: true }
        message: { type: string, description: "Plain text; may contain line breaks. Render as text, not HTML." }
        source: { $ref: "#/components/schemas/ContactRequestSource" }
        customerId:
          type: string
          nullable: true
          description: The customer (GX Account) when the message came from the signed-in Support page.
        createdAt: { type: string, format: date-time }

    AdminCustomer:
      type: object
      required: [id, company, contactEmail, status, createdAt]
      properties:
        id: { type: string }
        company: { type: string }
        contactEmail: { type: string, format: email }
        status: { $ref: "#/components/schemas/CustomerStatus" }
        plan: { type: string, nullable: true }
        partnerName: { type: string, nullable: true }
        mrr: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    AdminCustomerDetail:
      allOf:
        - $ref: "#/components/schemas/AdminCustomer"
        - type: object
          required: [sites, subscriptions, history]
          properties:
            contactName: { type: string, nullable: true }
            country: { type: string, nullable: true, example: India }
            trialEndsAt: { type: string, format: date-time, nullable: true }
            sites:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  productSlug: { type: string }
                  siteUrl: { type: string, nullable: true }
                  status: { $ref: "#/components/schemas/SiteStatus" }
            subscriptions:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  plan: { type: string }
                  status: { $ref: "#/components/schemas/SubscriptionStatus" }
                  currentPeriodEnd: { type: string, format: date-time, nullable: true }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  actor: { type: string }
                  action: { type: string, enum: [extend_trial, suspend, reactivate, record_payment, online_payment, online_payment_cancelled, billing_details_updated] }
                  details: { type: string, example: "trial → suspended: Chargeback" }

    AuditLogEntry:
      type: object
      required: [id, at, action]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, nullable: true, description: The user's email }
        action:
          type: string
          example: suspend
          description: |
            Without the entity prefix, e.g. `suspend` (customer), `approve` (partner), `reschedule` (appointment),
            `retry_provisioning` / `archive_tenant` / `open_site` / `add_custom_domain` / `remove_custom_domain` (tenant)
        entityType: { type: string, nullable: true, enum: [customer, partner, tenant, appointment, content, null], description: "`content` is proposed (website content edits)" }
        entityId: { type: string, nullable: true }
        entityLabel: { type: string, nullable: true, description: "Company, partner, site or visitor name" }
        details: { type: string, nullable: true }

    AdminTenant:
      type: object
      required: [id, customerId, customerName, productSlug, status, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        productSlug: { type: string }
        origin:
          type: string
          enum: [provisioned, imported]
          description: "`provisioned`: a site Core built for a GrowthX app. `imported`: the customer's own ERPNext site, billed on the direct product."
        plan: { type: string, nullable: true, description: "The subscription's plan id" }
        planName: { type: string, nullable: true }
        subscriptionStatus: { type: string, nullable: true, enum: [trialing, active, past_due, suspended, canceled], description: "`past_due` on an ERPNext Direct site is its first invoice, due" }
        siteUrl: { type: string, format: uri, nullable: true }
        status: { $ref: "#/components/schemas/SiteStatus" }
        lastError: { type: string, nullable: true, description: Admin-only detail }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminDirectSite:
      type: object
      required: [customer, tenant, created, accountCreated, pressCheck, warnings]
      properties:
        customer: { $ref: "#/components/schemas/AdminCustomerDetail" }
        tenant: { $ref: "#/components/schemas/AdminTenantDetail" }
        created: { type: boolean, description: "false when the same request was already done" }
        accountCreated: { type: boolean }
        inviteSent: { type: boolean, nullable: true, description: "null when no invite was due (an existing customer with a password)" }
        pressCheck: { type: string, enum: [confirmed, not_checked, unreachable, skipped] }
        warnings:
          type: array
          items: { type: string, enum: [press_unreachable, invite_not_sent, billing_details_not_saved] }

    AdminTenantDetail:
      allOf:
        - $ref: "#/components/schemas/AdminTenant"
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ProvisioningStep"
                  - type: object
                    properties:
                      attempt: { type: integer }
                      error: { type: string, nullable: true }

    AppointmentStatus:
      type: string
      enum: [confirmed, completed, cancelled, no_show]

    VisitorAppointment:
      type: object
      required: [id, status, start, end, name, canChange]
      properties:
        id: { type: string, example: GXA-00001 }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        name: { type: string }
        meetingUrl: { type: string, format: uri, nullable: true }
        canChange: { type: boolean, description: True while the booking is confirmed and the call hasn't started }

    AdminAppointment:
      type: object
      required: [id, status, start, end, name, email, phone, createdAt]
      properties:
        id: { type: string, example: GXA-00001 }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string, nullable: true }
        app: { type: string, nullable: true, description: Product slug }
        notes: { type: string, nullable: true, description: What the visitor wrote }
        expert: { type: string, format: email, nullable: true }
        meetingUrl: { type: string, format: uri, nullable: true }
        leadId: { type: string, nullable: true, description: ERPNext Lead }
        createdAt: { type: string, format: date-time }

    AdminAppointmentDetail:
      allOf:
        - $ref: "#/components/schemas/AdminAppointment"
        - type: object
          required: [history]
          properties:
            adminNotes: { type: string, nullable: true, description: Internal; never shown to the visitor }
            cancelledBy: { type: string, enum: [visitor, team], nullable: true }
            cancelReason: { type: string, nullable: true }
            history:
              type: array
              items:
                type: object
                required: [at, actor, action]
                properties:
                  at: { type: string, format: date-time }
                  actor: { type: string, description: "User id, or Guest for the visitor" }
                  action: { type: string, example: reschedule }
                  details: { type: string, nullable: true }

    ContentSiteSlugValue:
      type: string
      enum: [growthx, printagx, willpex, billax, phoebix, stayvex]
      description: The site's slug (its repo name without `-web`). New sites are added by Core.

    ContentSlug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 100
      example: gst-invoicing-for-print-shops

    ContentTag:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 30
      example: gst

    ContentPostStatus:
      type: string
      enum: [draft, scheduled, published]
      description: |
        `scheduled` goes live by itself once `publishedAt` passes (checked every 5 minutes); the public endpoints
        treat it as live from then on. Admin endpoints keep returning `scheduled` with `isLive: true`.

    ContentImageUrl:
      type: string
      format: uri
      maxLength: 500
      description: An image URL on the media host, exactly as `admin.upload_content_image` returned it.
      example: https://media.tbogrowthx.com/content/printagx/2026/3f9c2a7d1b4e5f60718293a4b5c6d7e8.webp

    ContentSeo:
      type: object
      required: [title, description, ogImage, noindex]
      properties:
        title: { type: string, nullable: true, maxLength: 70 }
        description: { type: string, nullable: true, maxLength: 200 }
        ogImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        noindex: { type: boolean }

    ContentPage:
      type: object
      description: Page SEO for one path. Empty fields fall back to the site defaults, then the site's built-in values.
      required: [path, title, description, ogImage, noindex]
      properties:
        path: { type: string, example: /pricing, maxLength: 200 }
        title: { type: string, nullable: true, maxLength: 70 }
        description: { type: string, nullable: true, maxLength: 200 }
        ogImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        noindex: { type: boolean }

    AdminContentPage:
      allOf:
        - $ref: "#/components/schemas/ContentPage"
        - type: object
          required: [id, site, updatedAt, updatedBy]
          properties:
            id: { type: string }
            site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string, format: email, nullable: true }

    ContentPageInput:
      allOf:
        - $ref: "#/components/schemas/ContentPage"
        - type: object
          required: [site]
          properties:
            site: { $ref: "#/components/schemas/ContentSiteSlugValue" }

    ContentRedirectRule:
      type: object
      required: [fromPath, toPath, permanent]
      properties:
        fromPath: { type: string, maxLength: 500, example: /blog/old-post }
        toPath:
          type: string
          maxLength: 500
          description: A path on the same site, or an https URL on an allowlisted GrowthX domain
          example: /blog/new-post
        permanent: { type: boolean, description: "true: 301, false: 302" }

    ContentRedirect:
      allOf:
        - $ref: "#/components/schemas/ContentRedirectRule"
        - type: object
          required: [id, site, enabled, updatedAt, updatedBy]
          properties:
            id: { type: string }
            site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
            enabled: { type: boolean }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string, format: email, nullable: true }

    ContentRedirectInput:
      allOf:
        - $ref: "#/components/schemas/ContentRedirectRule"
        - type: object
          required: [site]
          properties:
            site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
            enabled: { type: boolean, default: true }

    ContentSite:
      type: object
      description: What a site's server needs besides posts (`content.site`).
      required: [site, siteName, baseUrl, titleTemplate, defaults, verification, analyticsId, blogEnabled, pages, redirects, version]
      properties:
        site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
        siteName: { type: string, example: PrintagX }
        baseUrl: { type: string, format: uri, example: https://printagx.in }
        titleTemplate: { type: string, example: "%s · PrintagX", description: "`%s` is replaced by the page title" }
        defaults:
          type: object
          required: [title, description, ogImage]
          properties:
            title: { type: string, nullable: true, maxLength: 70 }
            description: { type: string, nullable: true, maxLength: 200 }
            ogImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        verification:
          type: object
          required: [google, bing]
          properties:
            google: { type: string, nullable: true, description: The google-site-verification meta content }
            bing: { type: string, nullable: true, description: The msvalidate.01 meta content }
        analyticsId:
          type: string
          nullable: true
          description: GA4 `G-…`. Always `null` until management approves tracking, even if an editor saved one.
        blogEnabled: { type: boolean, description: "false: hide /blog and /blog/<slug>" }
        pages:
          type: array
          items: { $ref: "#/components/schemas/ContentPage" }
        redirects:
          type: array
          description: Enabled redirects only
          items: { $ref: "#/components/schemas/ContentRedirectRule" }
        version: { type: string, description: "Opaque; changes on any change for this site. Compare, don't parse." }

    AdminContentSite:
      type: object
      required: [site, siteName, baseUrl, titleTemplate, defaultTitle, defaultDescription, defaultOgImage, googleVerification, bingVerification, analyticsId, analyticsActive, blogEnabled, postCounts, updatedAt]
      properties:
        site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
        siteName: { type: string }
        baseUrl: { type: string, format: uri, description: Set by Core; not editable here }
        titleTemplate: { type: string }
        defaultTitle: { type: string, nullable: true }
        defaultDescription: { type: string, nullable: true }
        defaultOgImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        googleVerification: { type: string, nullable: true }
        bingVerification: { type: string, nullable: true }
        analyticsId: { type: string, nullable: true }
        analyticsActive:
          type: boolean
          description: Whether the sites receive `analyticsId`. Off until management decides; show "saved, not active yet".
        blogEnabled: { type: boolean }
        postCounts:
          type: object
          required: [draft, scheduled, published]
          properties:
            draft: { type: integer }
            scheduled: { type: integer }
            published: { type: integer }
        updatedAt: { type: string, format: date-time }

    ContentSiteInput:
      type: object
      required: [site]
      properties:
        site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
        siteName: { type: string, maxLength: 60 }
        titleTemplate: { type: string, maxLength: 80, description: Must contain `%s` exactly once }
        defaultTitle: { type: string, nullable: true, maxLength: 70 }
        defaultDescription: { type: string, nullable: true, maxLength: 200 }
        defaultOgImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        googleVerification:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9_-]{10,100}$"
          description: Only the code, not the meta tag
        bingVerification:
          type: string
          nullable: true
          pattern: "^[A-Fa-f0-9]{32}$"
        analyticsId: { type: string, nullable: true, pattern: "^G-[A-Z0-9]{4,20}$" }
        blogEnabled: { type: boolean }

    ContentPostSummary:
      type: object
      required: [slug, title, excerpt, coverImage, coverAlt, authorName, tags, publishedAt, updatedAt]
      properties:
        slug: { $ref: "#/components/schemas/ContentSlug" }
        title: { type: string, maxLength: 150 }
        excerpt: { type: string, maxLength: 300 }
        coverImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        coverAlt: { type: string, nullable: true, maxLength: 200 }
        authorName: { type: string, nullable: true, maxLength: 100 }
        tags:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ContentTag" }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContentPost:
      allOf:
        - $ref: "#/components/schemas/ContentPostSummary"
        - type: object
          required: [body, seo, canonicalUrl]
          properties:
            body:
              type: string
              maxLength: 100000
              description: Markdown. Render with raw HTML switched off.
            seo: { $ref: "#/components/schemas/ContentSeo" }
            canonicalUrl:
              type: string
              format: uri
              nullable: true
              description: Only when the post was first published elsewhere; same domain rules as redirects

    ContentPostInput:
      type: object
      required: [site, slug, title, body, status]
      properties:
        id: { type: string, description: Omit to create }
        expectedUpdatedAt: { type: string, format: date-time, description: Optional edit-conflict check }
        site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        title: { type: string, maxLength: 150 }
        excerpt: { type: string, maxLength: 300, description: Defaults to the start of the body }
        body: { type: string, maxLength: 100000 }
        coverImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
        coverAlt: { type: string, nullable: true, maxLength: 200, description: Required when coverImage is set }
        authorName: { type: string, nullable: true, maxLength: 100 }
        tags:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ContentTag" }
        status: { $ref: "#/components/schemas/ContentPostStatus" }
        publishedAt: { type: string, format: date-time, nullable: true }
        seo: { $ref: "#/components/schemas/ContentSeo" }
        canonicalUrl: { type: string, format: uri, nullable: true }

    AdminContentPostSummary:
      type: object
      required: [id, site, slug, title, status, isLive, publishedAt, tags, authorName, updatedAt, updatedBy]
      properties:
        id: { type: string }
        site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        title: { type: string }
        status: { $ref: "#/components/schemas/ContentPostStatus" }
        isLive: { type: boolean, description: Visible on the site right now }
        publishedAt: { type: string, format: date-time, nullable: true }
        tags:
          type: array
          items: { $ref: "#/components/schemas/ContentTag" }
        authorName: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: email, nullable: true }

    AdminContentPost:
      allOf:
        - $ref: "#/components/schemas/AdminContentPostSummary"
        - type: object
          required: [excerpt, body, coverImage, coverAlt, seo, canonicalUrl, url, createdAt]
          properties:
            excerpt: { type: string, description: "The editor's excerpt, or empty when they left it to the body" }
            body: { type: string }
            coverImage: { allOf: [{ $ref: "#/components/schemas/ContentImageUrl" }], nullable: true }
            coverAlt: { type: string, nullable: true }
            seo: { $ref: "#/components/schemas/ContentSeo" }
            canonicalUrl: { type: string, format: uri, nullable: true }
            url: { type: string, format: uri, description: "`<baseUrl>/blog/<slug>`", example: https://printagx.in/blog/gst-invoicing }
            createdAt: { type: string, format: date-time }

    ContentImage:
      type: object
      required: [url, contentType, width, height, size]
      properties:
        url: { $ref: "#/components/schemas/ContentImageUrl" }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer, description: Bytes after re-encoding }

    TicketStatus:
      type: string
      enum: [open, pending_customer, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, normal, high, urgent]
    TicketCategory:
      type: string
      enum: [billing, technical, site, other]

    Ticket:
      type: object
      required: [id, subject, category, priority, status, createdAt, updatedAt]
      properties:
        id: { type: string, example: TKT-00001 }
        subject: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        tenantId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Last activity }
        resolvedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }

    TicketMessage:
      type: object
      required: [id, authorName, fromStaff, body, createdAt]
      properties:
        id: { type: string }
        authorName: { type: string }
        fromStaff: { type: boolean }
        body: { type: string, description: Plain text. Render as text, never as HTML }
        createdAt: { type: string, format: date-time }

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              description: Oldest first; internal notes are not included
              items: { $ref: "#/components/schemas/TicketMessage" }

    AdminTicket:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [accountId, customerEmail]
          properties:
            accountId: { type: string }
            company: { type: string, nullable: true }
            customerName: { type: string, nullable: true }
            customerEmail: { type: string }
            assignee:
              type: object
              nullable: true
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            firstResponseAt: { type: string, format: date-time, nullable: true }

    AdminTicketDetail:
      allOf:
        - $ref: "#/components/schemas/AdminTicket"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/TicketMessage"
                  - type: object
                    required: [internal]
                    properties:
                      internal: { type: boolean, description: A team-only note }
                      authorId: { type: string, nullable: true }

    AdminSupportSummary:
      type: object
      required: [open, pendingCustomer, resolved, closed, unassigned, urgent, staff]
      properties:
        open: { type: integer }
        pendingCustomer: { type: integer }
        resolved: { type: integer }
        closed: { type: integer }
        unassigned: { type: integer, description: Open or pending tickets with no assignee }
        urgent: { type: integer, description: Open or pending urgent tickets }
        staff:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
