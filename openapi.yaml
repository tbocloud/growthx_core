openapi: 3.0.3
info:
  title: GrowthX API
  version: 1.0.0
  description: |
    GrowthX Core API (Frappe app `growthx_core`). **Status: Agreed v1** (approved by Web and Flutter in the PR
    that set version 1.0.0).
    This file is the single API contract. It replaces the web team's `02-api-contract.md` (v0.5).
    Decisions and open items are in `docs/api-decisions.md`.

    **Changes from now on** go through a pull request reviewed by Frappe, Web and Flutter. Additive changes
    (new endpoints, new optional fields, building a `proposed` endpoint) stay in v1 as 1.x versions; breaking
    changes go into `growthx_core.api.v2`.

    ## Conventions
    - **Routing:** every endpoint is a Frappe whitelisted method in `growthx_core.api.v1.<module>`.
      The URL is the server URL plus the path below, e.g.
      `GET https://<core-host>/api/method/growthx_core.api.v1.catalogue.products`.
      The method name is joined with **dots**: `…/growthx_core.api.v1/catalogue.products` (a slash)
      is not a Frappe method and returns an error.
      GET methods take query parameters. POST methods take a JSON body (`Content-Type: application/json`).
    - **Response body:** the body **is** the resource. There is no Frappe `{"message": ...}` wrapper.
    - **Errors:** any non-2xx response has the body `{"error": {"code", "message", "fields"?, "reference"?}}`.
      `code` is stable and clients may branch on it. `message` is for people. `fields` maps
      form fields to messages. `reference` is a support id on 5xx responses. Tracebacks are never returned.
    - **Auth:** `Authorization: Bearer <accessToken>` from `auth.login` / `auth.signup` / `auth.refresh`.
      Only the Next.js server and the Flutter app hold tokens; the browser never does. Frappe cookie
      sessions (`sid`) are **not** accepted on v1 endpoints, and browser origins get no CORS headers.
    - **Money:** integer minor units (paise) plus an ISO 4217 code: `{"amount": 149900, "currency": "INR"}`.
      Never floats. Prices state `gstIncluded`.
    - **Dates:** ISO 8601 in UTC with a `Z` suffix, e.g. `2026-11-01T00:00:00Z`. Clients display them in IST.
      Months are `YYYY-MM`.
    - **Lists:** `page` (from 1) and `pageSize` (default 20, max 100). The response is `{items, page, pageSize, total}`.
      Filtering and sorting are done on the server.
    - **IDs:** opaque strings (Frappe document names). Clients must not parse them.
    - **Idempotency:** `auth.signup`, `billing.create_checkout` and `admin.retry_provisioning` accept an
      `Idempotency-Key` header (a UUID). A repeat with the same key within 24 h returns the original result.
    - **Visitor IP (website server only):** per-IP rate limits count the caller's IP. The website calls Core from
      its server, so it sends the visitor's IP in `X-GrowthX-Client-IP` with the shared secret in
      `X-GrowthX-Web-Key` (Core's `growthx_web_key`). Without the right key the header is ignored.
    - **Versioning:** additive changes stay in `v1`. Breaking changes go into a new `growthx_core.api.v2` module,
      and both run in parallel during migration.
    - **Phase:** `x-phase` on each operation is the delivery phase (1 Foundation, 2 Self sign-up,
      3 Money, 4 Launch). An endpoint is usable only once it is deployed to staging.
    - **Proposed endpoints:** operations marked `x-status: proposed` (summary starts with `[PROPOSED]`) are
      agreed shapes that are **not built yet**; calling one today returns an error. `x-decision` names a business
      decision still needed before it can be built. Everything else is implemented.
servers:
  - url: https://{host}/api/method
    variables:
      host:
        default: staging-core.growthx.example
        description: GrowthX Core site host. The real staging and production hosts are pending DevOps.
  - url: http://localhost:8002/api/method
    description: Local development (frappe-bench-v16, site growthX)

security:
  - bearerAuth: []

tags:
  - name: health
  - name: catalogue
  - name: appointments
  - name: auth
  - name: signup
    description: What the sign-up form offers, and the live subdomain check (docs 09 sign-up v2).
  - name: customer
  - name: billing
  - name: partner
  - name: admin
  - name: support
    description: Customer support tickets (role customer). The team's side is under admin.
  - name: tenant
    description: Server-to-server calls from tenant sites (growthx_theme). Not for Web or Flutter.
  - name: content
    description: |
      Blog and SEO for the six marketing sites. **Built:** `content.site`, `content.posts`, `content.post`,
      `content.sitemap`, `content_editor` sign-in, and the /content portal's posts, site SEO settings and page SEO
      (`admin.content_posts`/`content_post`/`save_content_post`/`delete_content_post`, `admin.content_sites`,
      `admin.update_content_site`, `admin.content_pages`, `admin.save_content_page`, `admin.delete_content_page`).
      Images (`admin.upload_content_image`) are built too. Still **[PROPOSED]**: redirects and revalidate. Public `content.*` calls are for the sites'
      servers and return live content only. `admin.*content*` calls are for /admin → Website content and take the
      `admin` or `content_editor` role. A `content_editor` sees these endpoints and nothing else in /admin: no
      customers, partners, payments, revenue, audit log or messages (`403 forbidden` there).

      Every admin write is audit-logged (`entityType: content`).

      **Delivery phases** (`x-content-phase` on each operation):

      - **Phase 1, blog posts:** `content.posts`, `content.post` and `content.sitemap`, with the shapes below.
        Editors write posts in Core desk (doctype **GX Website Post**, desk role **GrowthX Content Editor**,
        which can open only that doctype: no customers, partners, payments or revenue). Phase 1 was text-only;
        images arrived with `admin.upload_content_image` (S3 + media.tbogrowthx.com). The link rules, slug/tag formats, statuses and scheduling are as in phase 2.
        No revalidate call: the sites' 5-minute cache picks changes up. Every site's blog is on, and sites keep
        their built-in SEO defaults (no `content.site` yet).
      - **Phase 2, everything else:** `content.site` (SEO defaults, page SEO, redirects, verification,
        `blogEnabled`, `analyticsId`), every `admin.*content*` endpoint and the /admin → Website content editor,
        the `content_editor` API role, S3 images (`admin.upload_content_image`) and the signed revalidate call.
        Phase 1 posts carry over unchanged; the response shapes don't change.

      **Revalidate (Core → site, phase 2).** After a change, Core calls the affected site in the background:
      `POST <baseUrl>/api/revalidate` with body `{"site", "paths": ["/blog", "/blog/<slug>", …], "version"}`
      and headers `X-GrowthX-Timestamp` (Unix seconds) and `X-GrowthX-Signature: sha256=<hex>`, the HMAC-SHA256 of
      `<timestamp>.<raw body>` with that site's own secret (Core site_config `growthx_revalidate_secrets.<site>`,
      `GROWTHX_REVALIDATE_SECRET` on the site). The site rejects a bad signature or a timestamp more than 5 minutes
      off, then revalidates the paths. One try, 5-second timeout. If it fails or the site has no secret, the
      5-minute cache still picks the change up. A scheduled post going live sends the same call.

paths:
  # ---------------------------------------------------------------- health
  /growthx_core.api.v1.health.ping:
    get:
      tags: [health]
      summary: Liveness check
      operationId: healthPing
      x-phase: 0
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, example: 0.0.1 }

  /growthx_core.api.v1.health.provisioning:
    get:
      tags: [health]
      summary: Site-creation health, for the uptime alert
      description: |
        For DevOps monitoring: alert on any status other than 200. Counts only, no tenant or user data.
        Rate-limited to 60 per minute per IP address.

        `problems` (503):
        - `failed_sites`: sites in `failed` status; an admin retries or archives them.
        - `stuck_sites`: sites not ready 45 minutes after their current attempt started (a retry starts a new one).
        - `no_workers`: no worker on the `long` queue, so no site creation runs.
        - `queue_unreachable`: Core can't reach Redis.
        - `scheduler_not_running`: the scheduler is disabled or paused, or `resume_pending` (every minute) hasn't
          run for 5 minutes, so sites waiting on Press never move on.
      operationId: healthProvisioning
      x-phase: 2
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningHealth" }
        "503":
          description: At least one problem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningHealth" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- catalogue (public)
  /growthx_core.api.v1.catalogue.products:
    get:
      tags: [catalogue]
      summary: Product catalogue
      operationId: listProducts
      x-phase: 1
      security: []
      responses:
        "200":
          description: All products, including those marked coming soon
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "5XX": { $ref: "#/components/responses/ServerError" }

  /growthx_core.api.v1.catalogue.plans:
    get:
      tags: [catalogue]
      summary: Subscription plans
      operationId: listPlans
      x-phase: 1
      security: []
      parameters:
        - name: product
          in: query
          description: Product slug. If omitted, returns plans for all products.
          schema: { type: string, example: solar }
      description: |
        Public, but `price` is `null` unless the caller is signed in (sends a GrowthX bearer token):
        management doesn't want prices public. Signed-in pages call this same endpoint with the user's
        token to get prices. The site_config flag `growthx_public_prices` makes prices public again
        (no deploy).
      responses:
        "200":
          description: Active plans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "5XX": { $ref: "#/components/responses/ServerError" }

  /growthx_core.api.v1.contact.submit:
    post:
      tags: [catalogue]
      summary: Website contact form
      operationId: submitContact
      x-phase: 2
      security: []
      description: |
        The website's Contact form and the customer Support form. Saved as a GX Contact Request and emailed
        to support@tbogrowthx.com (site_config `growthx_support_email` overrides it), Reply-To the sender.
        A failed email is logged; the request is still saved and `202` returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 140 }
                email: { type: string, format: email }
                company: { type: string, maxLength: 140 }
                message: { type: string, maxLength: 5000 }
                source:
                  allOf:
                    - $ref: "#/components/schemas/ContactRequestSource"
                  description: |
                    Default `contact`. The Support page sends `support` together with the customer's bearer token;
                    Core takes the customer from the token (`customerId` in `admin.contact_requests`), never from the
                    body. Without a customer token, `customerId` stays null.
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- appointments
  /growthx_core.api.v1.appointments.slots:
    get:
      tags: [appointments]
      summary: Free "Talk to an expert" start times
      description: |
        Start times still free, at least the minimum notice away (2 h by default), in UTC.
        Show them in `timezone`. Opening hours, call length, working days, holidays and experts are set
        in GX Appointment Settings. **Never cache:** a slot can be booked at any moment.
      operationId: appointmentSlots
      x-phase: 2
      security: []
      parameters:
        - name: days
          in: query
          description: How many days ahead, including today.
          schema: { type: integer, minimum: 1, maximum: 60, default: 28 }
      responses:
        "200":
          description: Free slots
          content:
            application/json:
              schema:
                type: object
                required: [timezone, durationMinutes, slots]
                properties:
                  timezone: { type: string, example: Asia/Kolkata }
                  durationMinutes: { type: integer, example: 30 }
                  slots:
                    type: array
                    items: { type: string, format: date-time, example: "2026-10-14T04:30:00Z" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.book:
    post:
      tags: [appointments]
      summary: Book a "Talk to an expert" call
      description: |
        Books a start time from `appointments.slots`. The API assigns the least busy free expert, adds
        the video link (when a link template is set), records a Lead and an Event in ERPNext, and emails
        the visitor a confirmation with a calendar invite (copy to the expert). An email failure never
        fails the booking. `409 slot_taken` when the time is no longer free: reload the slots.
      operationId: bookAppointment
      x-phase: 2
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, name, email, phone]
              properties:
                start: { type: string, format: date-time, example: "2026-10-14T04:30:00Z" }
                name: { type: string, maxLength: 140 }
                email: { type: string, format: email }
                phone:
                  type: string
                  example: "+919876543210"
                  description: Indian mobile number, 10 digits, optionally starting with +91. Spaces and hyphens are ignored.
                company: { type: string, maxLength: 140 }
                app: { type: string, description: Product slug from `catalogue.products`, example: laundry }
                notes: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                required: [id, status, start, end]
                properties:
                  id: { type: string, example: GXA-00001 }
                  status: { type: string, enum: [confirmed] }
                  start: { type: string, format: date-time }
                  end: { type: string, format: date-time }
        "409":
          description: The time is no longer free (`slot_taken`), or the Idempotency-Key was reused with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.manage:
    get:
      tags: [appointments]
      summary: The visitor's own booking, from the private link in the confirmation email
      description: |
        The confirmation email links to `{growthx_web_url}/appointments/manage?token=…`. The token is random,
        stored only as a SHA-256 hash, and sent only in that first email. `canChange` is false once the call
        has started or the booking is no longer confirmed.
      operationId: manageAppointment
      x-phase: 2
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorAppointment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.cancel:
    post:
      tags: [appointments]
      summary: The visitor cancels their booking
      description: Frees the slot, cancels the ERPNext Event and emails a cancellation (with a calendar CANCEL).
      operationId: cancelAppointment
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorAppointment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_changeable`: already cancelled, completed or started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.reschedule:
    post:
      tags: [appointments]
      summary: The visitor moves their booking to another free time
      description: |
        `start` must be a free time from `appointments.slots`. The same expert is kept when they're free;
        otherwise the least busy free expert. Updates the ERPNext Event and emails the new time.
      operationId: rescheduleAppointment
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, start]
              properties:
                token: { type: string }
                start: { type: string, format: date-time }
      responses:
        "200":
          description: Rescheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorAppointment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`slot_taken`, or `not_changeable` (already cancelled, completed or started)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- auth
  /growthx_core.api.v1.auth.login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Called server-to-server by the Next.js server, or directly by the Flutter app. Never call it from browser JavaScript.
        Rate-limited per email and per IP address.

        Content editors (role `content_editor`, for the /content portal) sign in here with password only, while
        Core's `growthx_content_portal_login` is on (the default). Turning it off refuses their login and refresh
        and stops tokens they hold (`401`). Google sign-in (`auth.google`) stays closed to them.
      operationId: login
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: "`invalid_credentials`: wrong email or password, or the account is disabled (the response does not say which)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.google:
    post:
      tags: [auth]
      summary: Sign in with Google (web)
      description: |
        The Next.js server sends the user to Google (authorization-code flow, scope `openid email profile`, PKCE
        recommended), receives `code` at its callback, and posts it here **server-to-server**. Core exchanges it with
        Google using the same redirect URI: `<website>/api/auth/google/callback` (production
        `https://tbogrowthx.com/api/auth/google/callback`; core-test `http://localhost:3000/api/auth/google/callback`).
        A code works once.

        - The email belongs to an account: **200**, logged in (same body as `auth.login`).
        - A new email: **202** with a `signupToken`. Show the sign-up form with the name and email filled in (email
          read-only), and send the token to `auth.signup` as `googleSignupToken` instead of `email` and `password`.
        - A new email with `signInOnly: true` (signing in to a site, `auth.site_login`): **404 `no_account`**; no sign-up
          starts.

        Flutter will send a Google ID token instead (later). Rate-limited per IP address.
      operationId: googleSignin
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 2048, description: "`code` from Google's redirect to the callback" }
                codeVerifier: { type: string, maxLength: 128, description: "The PKCE verifier, if the website used PKCE" }
                client: { $ref: "#/components/schemas/ClientKind" }
                signInOnly:
                  type: boolean
                  description: "Sign-in-only mode (`/login?site=`): a new email gets `404 no_account` instead of a `202`"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "202":
          description: No account with this email yet
          content:
            application/json:
              schema:
                type: object
                required: [signupRequired, signupToken, expiresAt, email, name]
                properties:
                  signupRequired: { type: boolean, enum: [true] }
                  signupToken: { type: string, example: gxs_..., description: "For `auth.signup`; works for one account" }
                  expiresAt: { type: string, format: date-time, description: 30 minutes from now }
                  email: { type: string, format: email, description: Verified by Google }
                  name: { type: string, description: "The Google account's name; may be empty" }
        "400":
          description: "`google_failed`: the code is invalid, used or expired, or the redirect URI doesn't match"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            `email_not_verified`: Google hasn't verified the email. `account_unavailable`: the account is disabled, or
            is a staff account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`no_account`: with `signInOnly`, there's no GrowthX account for this Google account"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`google_unavailable`: Google sign-in isn't configured on this Core, or Google can't be reached"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.microsoft:
    post:
      tags: [auth]
      summary: Sign in with Microsoft (web)
      description: |
        One multi-tenant Entra app registration (any organizational directory and personal Microsoft accounts; authority
        `common`). The Next.js server sends the user to Microsoft (authorization-code flow, scope `openid profile email`,
        PKCE recommended), receives `code` at its callback, and posts it here **server-to-server**. Core exchanges it with
        Microsoft using the same redirect URI: `<website>/api/auth/microsoft/callback` (production
        `https://tbogrowthx.com/api/auth/microsoft/callback`). A code works once. The token's issuer must be
        `https://login.microsoftonline.com/{tid}/v2.0` for the token's own `tid`.

        **Staff** (the token's `tid` is `microsoft_oauth_staff_tenant_id`, the teambackoffice.com directory; guests of
        that directory are not staff): **200**, logged in as `admin`. A new email gets a GrowthX user with no password and
        the `GrowthX Admin` role (audit `staff.auto_provision`); an existing user gets the role if it lacks it. A user
        disabled in GrowthX stays blocked (`403 account_unavailable`).

        **Customers** (any other directory, and personal accounts): like `auth.google`, and never admin, whatever the
        email. A Microsoft account already linked (`tid.oid`) signs in (**200**). Otherwise an existing user is matched by
        email **only if the email is verified**: a personal account, or a work account whose token has the optional claim
        `xms_edov` (add the optional claims `email` and `xms_edov` to the app registration). An unverified email that
        already has an account: **409 `email_unverified`** (sign in another way, then link Microsoft from Account
        settings). A new email: **202** with a `signupToken` for `auth.signup`; with `signInOnly: true`, **404
        `no_account`**. Rate-limited per IP address.
      operationId: microsoftSignin
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 2048, description: "`code` from Microsoft's redirect to the callback" }
                codeVerifier: { type: string, maxLength: 128, description: "The PKCE verifier, if the website used PKCE" }
                client: { $ref: "#/components/schemas/ClientKind" }
                signInOnly:
                  type: boolean
                  description: "Sign-in-only mode (`/login?site=`): a new customer email gets `404 no_account` instead of a `202`"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "202": { $ref: "#/components/responses/SocialSignupRequired" }
        "400":
          description: "`microsoft_failed`: the code is invalid, used or expired, the redirect URI doesn't match, or the token's claims are wrong (audience, issuer, expiry)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`account_unavailable`: the account is disabled, is a staff account without a GrowthX role, or is an admin account (customers can't open those)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`no_account`: with `signInOnly`, there's no GrowthX account for this Microsoft account"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`email_unverified`: the email already has an account but Microsoft hasn't verified it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`microsoft_unavailable`: Microsoft sign-in isn't configured on this Core, or Microsoft can't be reached"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.github:
    post:
      tags: [auth]
      summary: Sign in or sign up with GitHub (web)
      description: |
        Like `auth.google`. The Next.js server sends the user to GitHub (OAuth app, scope `read:user user:email`, PKCE
        recommended), receives `code` at `<website>/api/auth/github/callback` and posts it here **server-to-server**.
        Core exchanges it with GitHub and uses only the **primary verified** email (`GET /user/emails`); the numeric
        GitHub id is the stable id. GitHub never opens an admin account.

        - An account is linked to this GitHub id, or the email belongs to an account: **200**, logged in.
        - A new email: **202** with a `signupToken` for `auth.signup` (`socialToken`). With `signInOnly: true`: **404
          `no_account`**.
        Rate-limited per IP address.
      operationId: githubSignin
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 2048, description: "`code` from GitHub's redirect to the callback" }
                codeVerifier: { type: string, maxLength: 128, description: "The PKCE verifier, if the website used PKCE" }
                client: { $ref: "#/components/schemas/ClientKind" }
                signInOnly: { type: boolean, description: "A new email gets `404 no_account` instead of a `202`" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "202": { $ref: "#/components/responses/SocialSignupRequired" }
        "400":
          description: "`github_failed`: the code is invalid, used or expired, the redirect URI doesn't match, or GitHub's API failed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`email_not_verified`: no primary verified email (or only a noreply address). `account_unavailable`: disabled, staff or admin account"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`no_account`: with `signInOnly`, there's no GrowthX account for this GitHub account"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`github_unavailable`: GitHub sign-in isn't configured on this Core, or GitHub can't be reached"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.link_provider:
    post:
      tags: [auth]
      summary: Link Google, Microsoft or GitHub to the logged-in account
      description: |
        Account settings. The same `code` flow as signing in (the callback runs in link mode), sent with the user's own
        token. Returns the user (`socialLogins` now includes the provider). `409 already_linked`: that provider account
        belongs to another GrowthX user; `409 provider_linked`: a different account of this provider is linked
        (unlink it first); `409 not_linkable`: a staff Microsoft account. Errors from the provider are as in
        `auth.google`, `auth.microsoft` and `auth.github`. 10 per 15 minutes per user.
      operationId: linkProvider
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code]
              properties:
                provider: { type: string, enum: [google, microsoft, github] }
                code: { type: string, maxLength: 2048 }
                codeVerifier: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: "`google_failed`, `microsoft_failed` or `github_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`already_linked`, `provider_linked` or `not_linkable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.unlink_provider:
    post:
      tags: [auth]
      summary: Unlink Google, Microsoft or GitHub from the logged-in account
      description: |
        Returns the user. `404 not_linked`; `409 last_sign_in_method` when it is the only way to sign in and the account
        has no password (`user.hasPassword: false`; set one with Forgot password first). 10 per 15 minutes per user.
      operationId: unlinkProvider
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [google, microsoft, github] }
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "`not_linked`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`last_sign_in_method`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.site_info:
    get:
      tags: [auth]
      summary: The site a "Sign in with GrowthX" button came from
      description: |
        "Sign in with GrowthX" on a customer site's login page goes to `<website>/login?site=<host>`. Call this to show
        "Sign in to Abc Solar" in sign-in-only mode (no "Start a free trial"). `site` is the host: the site's
        `<sub>.tbogrowthx.com` address or its custom domain once that's active (a full URL works too).
        `404 site_not_found`: unknown, archived, failed or not finished setting up. A suspended site is found (sign-in
        then gets `409 site_unavailable`). 60 a minute per IP address (send `X-GrowthX-Client-IP` from the server).
      operationId: getSiteInfo
      x-phase: 2
      security: []
      parameters:
        - name: site
          in: query
          required: true
          schema: { type: string, maxLength: 300, example: abc-solar.tbogrowthx.com }
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSignInInfo" }
        "404":
          description: "`site_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.site_login:
    post:
      tags: [auth]
      summary: A one-time sign-in link to the site, for its owner
      description: |
        After the person signs in to GrowthX and presses "Continue to Abc Solar" (never automatically on page load).
        Returns the same one-time link as "Open my app" (60 seconds, single use), to the site's address in Core's
        records (its custom domain once active), landing on the site's home page. Send the browser there and nowhere
        else. Any role can call it; only the site's owner gets a link. No Idempotency-Key: the link works once, so call
        again for a fresh one. 20 a minute per user.

        - `403 not_linked`: this GrowthX account doesn't own the site. `message` tells staff to use the site's own
          login, and `loginUrl` is the site's login page.
        - `409 site_unavailable`: the site is suspended.
        - `404 site_not_found`: as in `auth.site_info`.
      operationId: siteLogin
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site: { type: string, maxLength: 300, example: abc-solar.tbogrowthx.com }
      responses:
        "200":
          description: The one-time link
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`not_linked`, with `loginUrl`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`site_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`site_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.send_signup_code:
    post:
      tags: [auth]
      summary: Email a sign-up verification code
      description: |
        Step before `auth.signup` (not needed with `googleSignupToken`). Emails a 6-digit code that lasts 10 minutes
        and allows 5 wrong tries. A new code replaces the previous one; it can be asked for again from `resendAfter`
        (60 seconds). Rate-limited to 10 per hour per IP address and 5 per hour per email.
      operationId: sendSignupCode
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt, resendAfter]
                properties:
                  expiresAt: { type: string, format: date-time }
                  resendAfter: { type: string, format: date-time, description: Show the resend countdown until then }
        "409":
          description: "`email_taken` (with `fields.email`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: |
            `rate_limited`: asked again before `resendAfter`, or too many requests. `Retry-After` gives the seconds to
            wait.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`email_unavailable`: the email couldn't be sent; try again shortly"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.signup:
    post:
      tags: [auth]
      summary: Create a customer or partner account
      description: |
        Returns as soon as the account exists. **It does not wait for the customer's site.**
        For a customer with `productSlug`, the response includes the new site with status `requested`,
        and the client polls `customer.site`.

        On the server, for a customer: create the User, then the GX Account and ERPNext Customer, then the
        trial GX Subscription, then the GX Tenant (status `requested`), then queue the provisioning job, then
        record the referral. A partner account is created with status `pending_approval`.

        Unknown or self-referral codes are ignored; a sign-up never fails because of the referral code.
        The trial start rule (at sign-up, or when the site is ready) is pending the Lead (OI-2).
      operationId: signup
      x-phase: 2
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountType]
              description: |
                Either `email`, `password`, `name` and `emailCode` (from `auth.send_signup_code`), or `socialToken`
                (from `auth.google`, `auth.microsoft` or `auth.github`), with which `name` defaults to the provider's name.
              properties:
                accountType: { type: string, enum: [customer, partner] }
                socialToken:
                  type: string
                  description: |
                    The `signupToken` from `auth.google`, `auth.microsoft` or `auth.github` (202). The account gets the
                    provider's email; any `email` sent is ignored. If the 202 said `emailVerified: false` (a Microsoft
                    work account), `emailCode` is required as without a token. Otherwise as `googleSignupToken`.
                googleSignupToken:
                  type: string
                  description: |
                    Same as `socialToken`, kept for backward compatibility. The `signupToken` from `auth.google` (202). The account gets the email Google verified; any `email`
                    sent is ignored. Without `password` the account has none; the user can set one with "Forgot
                    password". Unknown, expired or used: 400 `google_signup_expired` (go through Google again). A
                    form error (422, 409) keeps the token, so the user can fix the form and resubmit.
                name: { type: string, maxLength: 140 }
                company: { type: string, maxLength: 140, description: "Required when accountType is customer. Can't contain < or > (422 validation_failed)" }
                email: { type: string, format: email, description: Required without a signup token }
                emailCode:
                  type: string
                  pattern: "^\\d{6}$"
                  description: |
                    Required without `socialToken`/`googleSignupToken`. The code `auth.send_signup_code` emailed. Wrong: 422 with
                    `fields.emailCode` (it says how many tries are left). Expired, never sent, or 5 wrong tries: 400
                    `email_code_expired`. It stays valid after other form errors, and is used up when the account is
                    created.
                phone: { type: string, example: "+919876543210" }
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: |
                    Required without `socialToken`/`googleSignupToken`. The site's password-strength policy also applies; a weak
                    password returns 422 with `fields.password`.
                productSlug: { type: string, example: solar }
                planId:
                  type: string
                  example: solar-growth-month
                  description: |
                    A plan id from `catalogue.plans`. Each plan has one interval (e.g. `solar-growth-month`,
                    `solar-growth-year`). If omitted, the product's highlighted plan for `billingInterval` is used.
                billingInterval: { $ref: "#/components/schemas/BillingInterval" }
                referralCode: { type: string, example: OKAFOR-7Q2 }
                subdomain:
                  type: string
                  example: noor-solar
                  description: |
                    Customer only, optional. The site's address, `<subdomain>.<tenantDomain>`: 5-32 of a-z, 0-9 and
                    `-`, starting and ending with a letter or digit (`^[a-z0-9][a-z0-9-]{3,30}[a-z0-9]$`); at most 27
                    on the Core test site, which creates `test-<subdomain>`. Upper case is lowered. Not reserved, not
                    taken (check with `tenant.check_subdomain`). Without it, one is made from `company`. Ignored when
                    no product is chosen (no site is created).
                country:
                  type: string
                  enum: [IN]
                  default: IN
                  description: |
                    Customer only. A `code` from `signup.options`. Sets the site's currency, timezone and fiscal year;
                    those are never sent.
                chartOfAccounts:
                  type: string
                  example: India - Chart of Accounts
                  description: Customer only. One of the country's `charts` from `signup.options`; default its `defaultChart`.
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthSession"
                  - type: object
                    properties:
                      site:
                        $ref: "#/components/schemas/SiteRef"
        "400":
          description: |
            `email_code_expired`: the email code expired, was never sent, or had 5 wrong tries (ask for a new one).
            `google_signup_expired`: the Google sign-up token is unknown, expired or used (continue with Google again).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `email_taken` (with `fields.email`); `subdomain_taken` (with `fields.subdomain`): the chosen subdomain was
            taken since the form checked it (in Core or on Press); or `idempotency_conflict` (same key, different body).
            An invalid or reserved `subdomain`, an unknown `country` or a `chartOfAccounts` not offered for the country
            is 422 with the field in `fields`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.signup.options:
    get:
      tags: [signup]
      summary: Countries and charts of accounts for the sign-up form
      description: |
        Countries a customer can choose (India only for now), with the currency, timezone and fiscal-year start
        Core sets from each, and ERPNext's charts of accounts for it. Load the form from this, so adding a country
        needs no website change. Changes rarely: the website may keep it for the page's lifetime.
      operationId: signupOptions
      x-phase: 2
      security: []
      responses:
        "200":
          description: The sign-up options
          content:
            application/json:
              schema:
                type: object
                required: [tenantDomain, countries, defaultCountry]
                properties:
                  tenantDomain: { type: string, example: tbogrowthx.com }
                  defaultCountry: { type: string, example: IN }
                  countries:
                    type: array
                    items:
                      type: object
                      required: [code, name, currency, timezone, fiscalYearStart, charts, defaultChart]
                      properties:
                        code: { type: string, example: IN }
                        name: { type: string, example: India }
                        currency: { type: string, example: INR }
                        timezone: { type: string, example: Asia/Kolkata }
                        fiscalYearStart: { type: string, pattern: "^\\d{2}-\\d{2}$", example: "04-01", description: "MM-DD" }
                        charts:
                          type: array
                          items: { type: string }
                          example: [India - Chart of Accounts, Standard, Standard with Numbers]
                        defaultChart: { type: string, example: India - Chart of Accounts }
        "5XX": { $ref: "#/components/responses/ServerError" }

  /growthx_core.api.v1.tenant.check_subdomain:
    get:
      tags: [signup]
      summary: Is this subdomain free?
      description: |
        For the sign-up form, as the customer types (at least 400 ms after the last keystroke). Checked within Core
        only (pattern, reserved names, existing sites), never on Press, so `auth.signup` can still return
        `409 subdomain_taken`. Upper case is lowered. Rate-limited to 120 per minute per IP address.
      operationId: checkSubdomain
      x-phase: 2
      security: []
      parameters:
        - name: subdomain
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The answer (also when the name is invalid)
          content:
            application/json:
              schema:
                type: object
                required: [subdomain, address, available, reason, suggestion]
                properties:
                  subdomain: { type: string, example: noor-solar }
                  address:
                    type: string
                    example: noor-solar.tbogrowthx.com
                    description: The full address the site would get (`test-...` on the Core test site)
                  available: { type: boolean }
                  reason:
                    type: string
                    nullable: true
                    enum: [invalid, reserved, taken, null]
                    description: Why it isn't available; null when it is
                  suggestion:
                    type: string
                    nullable: true
                    example: noor-solar-2
                    description: A free name close to a taken or reserved one; null otherwise
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: The refresh token is rotated. The old refresh token and its access token are revoked.
      operationId: refreshToken
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: "`invalid_token`: the refresh token is unknown, expired or revoked. The client must log in again."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.logout:
    post:
      tags: [auth]
      summary: Revoke the current access token and its refresh token
      operationId: logout
      x-phase: 1
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /growthx_core.api.v1.auth.change_password:
    post:
      tags: [auth]
      summary: Change the logged-in user's password
      description: |
        Every other session of the user is logged out (all their tokens are revoked), and this device gets new tokens
        in the response: replace the stored session with them. Google-only accounts (`user.hasPassword: false`) get
        `409 no_password`: point them to Forgot password to set one. Rate-limited to 5 per 15 minutes per user.
      operationId: changePassword
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword:
                  type: string
                  format: password
                  minLength: 10
                  maxLength: 128
                  description: |
                    At least one letter and one number; must differ from the current one. The site's password-strength
                    policy also applies. Problems: 422 with `fields.newPassword`.
      responses:
        "200":
          description: Changed; new tokens for this device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`no_password`: the account signs in with Google and has no password yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`wrong_password` (with `fields.currentPassword`), or `validation_failed` (`fields.newPassword`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.logout_others:
    post:
      tags: [auth]
      summary: Log out every other device
      description: Revokes all the user's tokens except the access and refresh token making this call.
      operationId: logoutOthers
      x-phase: 2
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked]
                properties:
                  ok: { type: boolean, enum: [true] }
                  revoked: { type: integer, description: How many sessions were logged out }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /growthx_core.api.v1.auth.me:
    get:
      tags: [auth]
      summary: The current user
      operationId: me
      x-phase: 1
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /growthx_core.api.v1.auth.forgot_password:
    post:
      tags: [auth]
      summary: Email a password-reset link
      description: |
        Always returns 202, whether or not the email exists, so the endpoint can't be used to find out which
        emails have accounts. Also 202 when the email can't be sent (e.g. no outgoing email account); the
        failure goes to the Error Log for admins.
      operationId: forgotPassword
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.reset_password:
    post:
      tags: [auth]
      summary: Set a new password with the emailed reset key
      description: Revokes all of the user's existing tokens.
      operationId: resetPassword
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, newPassword]
              properties:
                key: { type: string }
