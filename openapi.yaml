                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminPayout" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.create_payouts:
    post:
      tags: [admin]
      summary: Run payouts for a month
      description: |
        For each active partner whose `approved`, unpaid commission on payments up to the end of `period` adds up to
        the minimum payout (Partner Program Settings), creates a `draft` payout: gross, TDS (once on the total,
        rounded half up to the paisa) and net. Smaller balances are listed in `skipped` and carry over. Safe to
        repeat: a commission already in a payout is never included twice. Audit-logged. Accepts `Idempotency-Key`.
      operationId: adminCreatePayouts
      x-phase: 3
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, pattern: "^\\d{4}-\\d{2}$", description: "Month, not later than the current one" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPayout" }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [partner, reason, amount]
                      properties:
                        partner: { type: string }
                        reason: { type: string, enum: [below_minimum, partner_not_active] }
                        amount: { $ref: "#/components/schemas/Money" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.mark_payout_paid:
    post:
      tags: [admin]
      summary: Record that a payout was transferred
      description: |
        `draft` → `paid`, with the bank or UPI reference, the date and the method. Its commissions become `paid` and
        the partner is notified in the app (and by email if they opted in to commission updates). Anything but a draft
        answers `409 not_draft`, so a payout can't be paid twice. Audit-logged. Accepts `Idempotency-Key`.
      operationId: adminMarkPayoutPaid
      x-phase: 3
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, reference, paidOn, method]
              properties:
                id: { type: string }
                reference: { type: string, maxLength: 140, description: UTR or transaction reference }
                paidOn: { type: string, format: date, description: Not in the future }
                method: { type: string, enum: [bank_transfer, upi, other] }
      responses:
        "200":
          description: The payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPayout" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_draft`: the payout is already paid or cancelled"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.cancel_payout:
    post:
      tags: [admin]
      summary: Cancel a draft payout
      description: Its commissions go back to `approved` and unpaid, ready for the next run. `409 not_draft` otherwise. Audit-logged.
      operationId: adminCancelPayout
      x-phase: 3
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: The payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPayout" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_draft`: the payout is already paid or cancelled"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.admin.update_partner_status:
    post:
      tags: [admin]
      summary: Approve, suspend or reactivate a partner
      description: |
        - `approve`: `pending_approval` → `active`. Creates the partner's ERPNext Sales Partner (commission) and emails
          them that they're approved, with their referral code.
        - `suspend` (`reason` required): `pending_approval` or `active` → `suspended`. Their referral code stops
          working for new sign-ups (customers already referred stay theirs). Use it to reject an application too.
        - `reactivate`: `suspended` → `active`.

        Every action is in the audit log (`history` in the response). Accepts `Idempotency-Key`.
      operationId: adminUpdatePartnerStatus
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: string, description: Partner id }
                action: { type: string, enum: [approve, suspend, reactivate] }
                reason: { type: string, maxLength: 500, description: Required for suspend; optional otherwise }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartnerDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_changeable`: the action doesn't apply to the partner's status (e.g. approving an active partner)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.customer:
    get:
      tags: [admin]
      summary: One customer, with sites, subscriptions and history
      operationId: adminGetCustomer
      x-phase: 2
      x-roles: [admin]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /growthx_core.api.v1.admin.update_customer_status:
    post:
      tags: [admin]
      summary: Extend a trial, suspend or reactivate a customer
      description: |
        - `extend_trial` (`days` 1-30, a whole number): status `trial` only. Adds the days to whichever is later, now or
          the trial end.
        - `suspend` (`reason` required): `trial` or `active` → `suspended`. Their ready sites are taken offline (Press
          keeps the data).
        - `reactivate`: `suspended` → `trial` if the trial hasn't ended, otherwise `active`. Their suspended sites come
          back.

        Subscriptions are not changed (billing will own them). If Press refuses a site, the action still completes,
        that site keeps its status, and the history entry names it. Every action is in `history` and the audit log.
        Accepts `Idempotency-Key`: a new key per intended action.
      operationId: adminUpdateCustomerStatus
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: string, description: Customer id }
                action: { type: string, enum: [extend_trial, suspend, reactivate] }
                days: { type: integer, minimum: 1, maximum: 30, description: Required for extend_trial }
                reason: { type: string, maxLength: 500, description: Required for suspend; optional otherwise }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`: the action doesn't apply to the customer's status (or there's no trial to extend)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.record_payment:
    post:
      tags: [admin]
      summary: Record a payment made directly (bank transfer) and make the customer active
      description: |
        For payments made to us directly while there's no payment gateway: a first payment (status `trial` or
        `suspended`) or a renewal (status `active`).

        - The customer's subscription for the plan's product moves to `plan` (an active or a retired plan) and becomes
          `active`. The trial end is cleared.
        - `currentPeriodEnd` moves one billing period on from `paidOn`, or, for a renewal paid before the current
          period ends, from the current period end. A `one_time` (lifetime) plan sets it to `null`: never expires.
          Moving from a monthly or yearly plan to lifetime is allowed; a customer already on lifetime gets `409
          invalid_transition`.
        - The customer becomes `active`. A suspended customer's sites come back, as with `reactivate`.
        - The payment (amount, the plan's price, date, reference, new period end) is in `history` and the audit log.
          No invoice is created, and the customer isn't emailed.
        - The customer's open online checkouts for the product are cancelled first (invoice and PayU Payment
          Request), so they can't also pay online. `409 payment_in_progress` instead, and nothing is recorded, if
          one is part-paid or has a PayU attempt that may still succeed (any attempt Authorized, at any age and
          even if a newer one failed, since PayU has the money and the payment is still being completed; or the
          newest Queued and under 30 minutes old): wait for it, then
          check the customer before recording.

        Accepts `Idempotency-Key`: a new key per payment.
      operationId: adminRecordPayment
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, plan, amount, reference, paidOn]
              properties:
                id: { type: string, description: Customer id }
                plan: { type: string, description: "Plan id (`Plan.id`) for one of the customer's products" }
                amount: { type: integer, minimum: 1, description: Amount paid in paise, example: 15000000 }
                reference: { type: string, maxLength: 140, description: "Bank transfer reference (UTR) or receipt number" }
                paidOn: { type: string, format: date, description: "Date paid, YYYY-MM-DD, not in the future" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`: the customer is churned. `duplicate_payment`: this reference is already recorded on the subscription. `payment_in_progress`: an online payment for this product is under way (see above)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.staff:
    get:
      tags: [admin]
      summary: Team members (admins and content editors)
      description: |
        Everyone with the GrowthX Admin or Content Editor role (a user with both is `admin`), sorted by
