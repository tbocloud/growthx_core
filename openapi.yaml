  /growthx_core.api.v1.admin.save_content_post:
    post:
      tags: [content]
      summary: "Create or update a post"
      description: |
        Without `id` it creates a post; with `id` it replaces that post's fields (send the whole post).

        - `status`: `draft` (not public), `published` (`publishedAt` defaults to now; a past date is kept, e.g. for
          an imported post), or `scheduled` (`publishedAt` required and in the future; it goes live by itself).
        - `body` is Markdown and is checked: link and image targets must be `http(s)://`, `mailto:` or a relative
          path (`/…`, `#…`), so `javascript:` and `data:` are refused (`422 fields.body`). Images in the body and
          `coverImage`/`ogImage` must be on the media host (from `admin.upload_content_image`), anything else
          is `422`. Body images must be inline (`![description](url)`), not reference-style. `coverAlt` is required
          with a `coverImage`. Raw HTML is stored as typed; the sites render Markdown with HTML switched off.
        - Plain-text fields (`title`, `excerpt`, `authorName`, `seo.title`, `seo.description`) can't contain `<` or
          `>` (`422`). `publishedAt` takes any ISO 8601 offset (`Z` included) and comes back in UTC.
        - Errors name the field: `slug`, `title`, `body`, `tags`, `publishedAt`, `seo.title`, `canonicalUrl`, ….
          The checks are the same as in Core desk.
        - `expectedUpdatedAt` (optional, the `updatedAt` the editor loaded): if the post changed since, `409
          edit_conflict` instead of overwriting someone else's edit.
        - `409 slug_taken` if another post on the site has the slug. Changing a published post's slug doesn't add a
          redirect by itself; add one with `admin.save_content_redirect`.

        Audit-logged. Will trigger a revalidate of `/blog` and the post's path once revalidate is built; until
        then the sites pick changes up within 5 minutes.
      operationId: adminSaveContentPost
      x-content-phase: 2
      x-phase: 4
      x-roles: [admin, content_editor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPostInput" }
      responses:
        "200":
          description: The saved post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentPost" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`slug_taken` or `edit_conflict`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

