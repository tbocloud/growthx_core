        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.partner.request_payout_method_otp:
    post:
      tags: [partner]
      summary: "[PROPOSED] Send a one-time code before changing payout details"
      description: Sends a 6-digit code to the partner's verified phone (or email), valid 10 minutes.
      operationId: partnerRequestPayoutMethodOtp
      x-status: proposed
      x-phase: 3
      x-decision: "Verification: SMS OTP, email OTP, or password re-entry? Needs an SMS provider if SMS (Sammish)"
      x-roles: [partner]
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, sentTo, expiresAt]
                properties:
                  ok: { type: boolean, enum: [true] }
                  sentTo: { type: string, description: Masked destination, example: "+91******3412" }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.partner.update_payout_method:
    post:
      tags: [partner]
      summary: "[PROPOSED] Change bank account or UPI for payouts (verified)"
      description: |
        Needs the code from `partner.request_payout_method_otp`. Audit-logged. The full account number is accepted here
        but never returned; responses show `accountLast4` only.
      operationId: partnerUpdatePayoutMethod
      x-status: proposed
      x-phase: 3
      x-roles: [partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, otp]
              properties:
                type: { type: string, enum: [bank, upi] }
                otp: { type: string, example: "123456" }
                bank:
                  type: object
                  description: Required when type is bank
                  required: [accountHolder, accountNumber, ifsc]
                  properties:
                    accountHolder: { type: string }
                    accountNumber: { type: string }
                    ifsc: { type: string, example: HDFC0001234 }
                upiId: { type: string, description: Required when type is upi, example: partner@okhdfc }
      responses:
        "200":
          description: Saved (masked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutMethod" }
        "400":
          description: "`invalid_otp`: wrong or expired code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

