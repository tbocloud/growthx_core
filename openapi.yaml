            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`email_failed`: the email could not be sent"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.admin.terminate_tenant:
    post:
      tags: [admin]
      summary: Terminate a site and its billing
      description: |
        For good: a site Core built is backed up and then deleted on Press; an imported ERPNext site is
        the customer's own, so it keeps running and only billing stops. The tenant becomes `archived`
        and its subscription `canceled`. A site still being set up can't be terminated, and an archive
