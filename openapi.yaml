openapi: 3.0.3
info:
  title: GrowthX API
  version: 1.0.0-draft.5
  description: |
    GrowthX Core API (Frappe app `growthx_core`). **Status: DRAFT for review by Web, Flutter and the Lead.**
    This file is the single API contract. Once agreed, it replaces the web team's
    `02-api-contract.md` proposal. Decisions and open items are in `docs/api-decisions.md`.

    ## Conventions
    - **Routing:** every endpoint is a Frappe whitelisted method in `growthx_core.api.v1.<module>`.
      The URL is the server URL plus the path below, e.g.
      `GET https://<core-host>/api/method/growthx_core.api.v1.catalogue.products`.
      The method name is joined with **dots**: `…/growthx_core.api.v1/catalogue.products` (a slash)
      is not a Frappe method and returns an error.
      GET methods take query parameters. POST methods take a JSON body (`Content-Type: application/json`).
    - **Response body:** the body **is** the resource. There is no Frappe `{"message": ...}` wrapper.
    - **Errors:** any non-2xx response has the body `{"error": {"code", "message", "fields"?, "reference"?}}`.
      `code` is stable and clients may branch on it. `message` is for people. `fields` maps
      form fields to messages. `reference` is a support id on 5xx responses. Tracebacks are never returned.
    - **Auth:** `Authorization: Bearer <accessToken>` from `auth.login` / `auth.signup` / `auth.refresh`.
      Only the Next.js server and the Flutter app hold tokens; the browser never does. Frappe cookie
      sessions (`sid`) are **not** accepted on v1 endpoints, and browser origins get no CORS headers.
    - **Money:** integer minor units (paise) plus an ISO 4217 code: `{"amount": 149900, "currency": "INR"}`.
      Never floats. Prices state `gstIncluded`.
    - **Dates:** ISO 8601 in UTC with a `Z` suffix, e.g. `2026-11-01T00:00:00Z`. Clients display them in IST.
      Months are `YYYY-MM`.
    - **Lists:** `page` (from 1) and `pageSize` (default 20, max 100). The response is `{items, page, pageSize, total}`.
      Filtering and sorting are done on the server.
    - **IDs:** opaque strings (Frappe document names). Clients must not parse them.
    - **Idempotency:** `auth.signup`, `billing.create_checkout` and `admin.retry_provisioning` accept an
      `Idempotency-Key` header (a UUID). A repeat with the same key within 24 h returns the original result.
    - **Visitor IP (website server only):** per-IP rate limits count the caller's IP. The website calls Core from
      its server, so it sends the visitor's IP in `X-GrowthX-Client-IP` with the shared secret in
      `X-GrowthX-Web-Key` (Core's `growthx_web_key`). Without the right key the header is ignored.
    - **Versioning:** additive changes stay in `v1`. Breaking changes go into a new `growthx_core.api.v2` module,
      and both run in parallel during migration.
    - **Phase:** `x-phase` on each operation is the delivery phase (1 Foundation, 2 Self sign-up,
      3 Money, 4 Launch). An endpoint is usable only once it is deployed to staging.
    - **Proposed endpoints:** operations marked `x-status: proposed` (summary starts with `[PROPOSED]`) are
      agreed shapes that are **not built yet**; calling one today returns an error. `x-decision` names a business
      decision still needed before it can be built. Everything else is implemented.
servers:
  - url: https://{host}/api/method
    variables:
      host:
        default: staging-core.growthx.example
        description: GrowthX Core site host. The real staging and production hosts are pending DevOps.
  - url: http://localhost:8002/api/method
    description: Local development (frappe-bench-v16, site growthX)

security:
  - bearerAuth: []

tags:
  - name: health
  - name: catalogue
  - name: appointments
  - name: auth
  - name: signup
    description: What the sign-up form offers, and the live subdomain check (docs 09 sign-up v2).
  - name: customer
  - name: billing
  - name: partner
  - name: admin
  - name: tenant
    description: Server-to-server calls from tenant sites (growthx_theme). Not for Web or Flutter.

paths:
  # ---------------------------------------------------------------- health
  /growthx_core.api.v1.health.ping:
    get:
      tags: [health]
      summary: Liveness check
      operationId: healthPing
      x-phase: 0
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, example: 0.0.1 }

  /growthx_core.api.v1.health.provisioning:
    get:
      tags: [health]
      summary: Site-creation health, for the uptime alert
      description: |
        For DevOps monitoring: alert on any status other than 200. Counts only, no tenant or user data.
        Rate-limited to 60 per minute per IP address.

        `problems` (503):
        - `failed_sites`: sites in `failed` status; an admin retries or archives them.
        - `stuck_sites`: sites not ready 45 minutes after their current attempt started (a retry starts a new one).
        - `no_workers`: no worker on the `long` queue, so no site creation runs.
        - `queue_unreachable`: Core can't reach Redis.
        - `scheduler_not_running`: the scheduler is disabled or paused, or `resume_pending` (every minute) hasn't
          run for 5 minutes, so sites waiting on Press never move on.
      operationId: healthProvisioning
      x-phase: 2
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningHealth" }
        "503":
          description: At least one problem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningHealth" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- catalogue (public)
  /growthx_core.api.v1.catalogue.products:
    get:
      tags: [catalogue]
      summary: Product catalogue
      operationId: listProducts
      x-phase: 1
      security: []
      responses:
        "200":
          description: All products, including those marked coming soon
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "5XX": { $ref: "#/components/responses/ServerError" }

  /growthx_core.api.v1.catalogue.plans:
    get:
      tags: [catalogue]
      summary: Subscription plans
      operationId: listPlans
      x-phase: 1
      security: []
      parameters:
        - name: product
          in: query
          description: Product slug. If omitted, returns plans for all products.
          schema: { type: string, example: solar }
      responses:
        "200":
          description: Active plans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "5XX": { $ref: "#/components/responses/ServerError" }

  /growthx_core.api.v1.contact.submit:
    post:
      tags: [catalogue]
      summary: Website contact form
      operationId: submitContact
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 140 }
                email: { type: string, format: email }
                company: { type: string, maxLength: 140 }
                message: { type: string, maxLength: 5000 }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- appointments
  /growthx_core.api.v1.appointments.slots:
    get:
      tags: [appointments]
      summary: Free "Talk to an expert" start times
      description: |
        Start times still free, at least the minimum notice away (2 h by default), in UTC.
        Show them in `timezone`. Opening hours, call length, working days, holidays and experts are set
        in GX Appointment Settings. **Never cache:** a slot can be booked at any moment.
      operationId: appointmentSlots
      x-phase: 2
      security: []
      parameters:
        - name: days
          in: query
          description: How many days ahead, including today.
          schema: { type: integer, minimum: 1, maximum: 60, default: 28 }
      responses:
        "200":
          description: Free slots
          content:
            application/json:
              schema:
                type: object
                required: [timezone, durationMinutes, slots]
                properties:
                  timezone: { type: string, example: Asia/Kolkata }
                  durationMinutes: { type: integer, example: 30 }
                  slots:
                    type: array
                    items: { type: string, format: date-time, example: "2026-10-14T04:30:00Z" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.book:
    post:
      tags: [appointments]
      summary: Book a "Talk to an expert" call
      description: |
        Books a start time from `appointments.slots`. The API assigns the least busy free expert, adds
        the video link (when a link template is set), records a Lead and an Event in ERPNext, and emails
        the visitor a confirmation with a calendar invite (copy to the expert). An email failure never
        fails the booking. `409 slot_taken` when the time is no longer free: reload the slots.
      operationId: bookAppointment
      x-phase: 2
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, name, email, phone]
              properties:
                start: { type: string, format: date-time, example: "2026-10-14T04:30:00Z" }
                name: { type: string, maxLength: 140 }
                email: { type: string, format: email }
                phone:
                  type: string
                  example: "+919876543210"
                  description: Indian mobile number, 10 digits, optionally starting with +91. Spaces and hyphens are ignored.
                company: { type: string, maxLength: 140 }
                app: { type: string, description: Product slug from `catalogue.products`, example: laundry }
                notes: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                required: [id, status, start, end]
                properties:
                  id: { type: string, example: GXA-00001 }
                  status: { type: string, enum: [confirmed] }
                  start: { type: string, format: date-time }
                  end: { type: string, format: date-time }
        "409":
          description: The time is no longer free (`slot_taken`), or the Idempotency-Key was reused with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.manage:
    get:
      tags: [appointments]
      summary: The visitor's own booking, from the private link in the confirmation email
      description: |
        The confirmation email links to `{growthx_web_url}/appointments/manage?token=…`. The token is random,
        stored only as a SHA-256 hash, and sent only in that first email. `canChange` is false once the call
        has started or the booking is no longer confirmed.
      operationId: manageAppointment
      x-phase: 2
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorAppointment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.cancel:
    post:
      tags: [appointments]
      summary: The visitor cancels their booking
      description: Frees the slot, cancels the ERPNext Event and emails a cancellation (with a calendar CANCEL).
      operationId: cancelAppointment
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorAppointment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_changeable`: already cancelled, completed or started"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.appointments.reschedule:
    post:
      tags: [appointments]
      summary: The visitor moves their booking to another free time
      description: |
        `start` must be a free time from `appointments.slots`. The same expert is kept when they're free;
        otherwise the least busy free expert. Updates the ERPNext Event and emails the new time.
      operationId: rescheduleAppointment
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, start]
              properties:
                token: { type: string }
                start: { type: string, format: date-time }
      responses:
        "200":
          description: Rescheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorAppointment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`slot_taken`, or `not_changeable` (already cancelled, completed or started)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- auth
  /growthx_core.api.v1.auth.login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Called server-to-server by the Next.js server, or directly by the Flutter app. Never call it from browser JavaScript.
        Rate-limited per email and per IP address.
      operationId: login
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: "`invalid_credentials`: wrong email or password, or the account is disabled (the response does not say which)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.google:
    post:
      tags: [auth]
      summary: Sign in with Google (web)
      description: |
        The Next.js server sends the user to Google (authorization-code flow, scope `openid email profile`, PKCE
        recommended), receives `code` at its callback, and posts it here **server-to-server**. Core exchanges it with
        Google using the same redirect URI: `<website>/api/auth/google/callback` (production
        `https://tbogrowthx.com/api/auth/google/callback`; core-test `http://localhost:3000/api/auth/google/callback`).
        A code works once.

        - The email belongs to an account: **200**, logged in (same body as `auth.login`).
        - A new email: **202** with a `signupToken`. Show the sign-up form with the name and email filled in (email
          read-only), and send the token to `auth.signup` as `googleSignupToken` instead of `email` and `password`.

        Flutter will send a Google ID token instead (later). Rate-limited per IP address.
      operationId: googleSignin
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 2048, description: "`code` from Google's redirect to the callback" }
                codeVerifier: { type: string, maxLength: 128, description: The PKCE verifier, if the website used PKCE }
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "202":
          description: No account with this email yet
          content:
            application/json:
              schema:
                type: object
                required: [signupRequired, signupToken, expiresAt, email, name]
                properties:
                  signupRequired: { type: boolean, enum: [true] }
                  signupToken: { type: string, example: gxg_..., description: "For `auth.signup`; works for one account" }
                  expiresAt: { type: string, format: date-time, description: 30 minutes from now }
                  email: { type: string, format: email, description: Verified by Google }
                  name: { type: string, description: "The Google account's name; may be empty" }
        "400":
          description: "`google_failed`: the code is invalid, used or expired, or the redirect URI doesn't match"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            `email_not_verified`: Google hasn't verified the email. `account_unavailable`: the account is disabled, or
            is a staff account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`google_unavailable`: Google sign-in isn't configured on this Core, or Google can't be reached"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.signup:
    post:
      tags: [auth]
      summary: Create a customer or partner account
      description: |
        Returns as soon as the account exists. **It does not wait for the customer's site.**
        For a customer with `productSlug`, the response includes the new site with status `requested`,
        and the client polls `customer.site`.

        On the server, for a customer: create the User, then the GX Account and ERPNext Customer, then the
        trial GX Subscription, then the GX Tenant (status `requested`), then queue the provisioning job, then
        record the referral. A partner account is created with status `pending_approval`.

        Unknown or self-referral codes are ignored; a sign-up never fails because of the referral code.
        The trial start rule (at sign-up, or when the site is ready) is pending the Lead (OI-2).
      operationId: signup
      x-phase: 2
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountType, name, email, password]
              description: With `googleSignupToken`, `email` and `password` aren't needed, and `name` defaults to the Google name.
              properties:
                accountType: { type: string, enum: [customer, partner] }
                googleSignupToken:
                  type: string
                  description: |
                    The `signupToken` from `auth.google` (202). The account gets the email Google verified; any `email`
                    sent is ignored. Without `password` the account has none; the user can set one with "Forgot
                    password". Unknown, expired or used: 400 `google_signup_expired` (go through Google again). A
                    form error (422, 409) keeps the token, so the user can fix the form and resubmit.
                name: { type: string, maxLength: 140 }
                company: { type: string, maxLength: 140, description: Required when accountType is customer }
                email: { type: string, format: email }
                phone: { type: string, example: "+919876543210" }
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: The site's password-strength policy also applies; a weak password returns 422 with `fields.password`.
                productSlug: { type: string, example: solar }
                planId:
                  type: string
                  example: solar-growth-month
                  description: |
                    A plan id from `catalogue.plans`. Each plan has one interval (e.g. `solar-growth-month`,
                    `solar-growth-year`). If omitted, the product's highlighted plan for `billingInterval` is used.
                billingInterval: { $ref: "#/components/schemas/BillingInterval" }
                referralCode: { type: string, example: OKAFOR-7Q2 }
                subdomain:
                  type: string
                  example: noor-solar
                  description: |
                    Customer only, optional. The site's address, `<subdomain>.<tenantDomain>`: 5-32 of a-z, 0-9 and
                    `-`, starting and ending with a letter or digit (`^[a-z0-9][a-z0-9-]{3,30}[a-z0-9]$`); at most 27
                    on the Core test site, which creates `test-<subdomain>`. Upper case is lowered. Not reserved, not
                    taken (check with `tenant.check_subdomain`). Without it, one is made from `company`. Ignored when
                    no product is chosen (no site is created).
                country:
                  type: string
                  enum: [IN, AE]
                  default: IN
                  description: |
                    Customer only. A `code` from `signup.options`. Sets the site's currency, timezone and fiscal year;
                    those are never sent.
                chartOfAccounts:
                  type: string
                  example: India - Chart of Accounts
                  description: Customer only. One of the country's `charts` from `signup.options`; default its `defaultChart`.
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthSession"
                  - type: object
                    properties:
                      site:
                        $ref: "#/components/schemas/SiteRef"
        "409":
          description: |
            `email_taken` (with `fields.email`); `subdomain_taken` (with `fields.subdomain`): the chosen subdomain was
            taken since the form checked it (in Core or on Press); or `idempotency_conflict` (same key, different body).
            An invalid or reserved `subdomain`, an unknown `country` or a `chartOfAccounts` not offered for the country
            is 422 with the field in `fields`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.signup.options:
    get:
      tags: [signup]
      summary: Countries and charts of accounts for the sign-up form
      description: |
        Countries a customer can choose (India and UAE at launch), with the currency, timezone and fiscal-year start
        Core sets from each, and ERPNext's charts of accounts for it. Load the form from this, so adding a country
        needs no website change. Changes rarely: the website may keep it for the page's lifetime.
      operationId: signupOptions
      x-phase: 2
      security: []
      responses:
        "200":
          description: The sign-up options
          content:
            application/json:
              schema:
                type: object
                required: [tenantDomain, countries, defaultCountry]
                properties:
                  tenantDomain: { type: string, example: tbogrowthx.com }
                  defaultCountry: { type: string, example: IN }
                  countries:
                    type: array
                    items:
                      type: object
                      required: [code, name, currency, timezone, fiscalYearStart, charts, defaultChart]
                      properties:
                        code: { type: string, example: IN }
                        name: { type: string, example: India }
                        currency: { type: string, example: INR }
                        timezone: { type: string, example: Asia/Kolkata }
                        fiscalYearStart: { type: string, pattern: "^\\d{2}-\\d{2}$", example: "04-01", description: "MM-DD" }
                        charts:
                          type: array
                          items: { type: string }
                          example: [India - Chart of Accounts, Standard, Standard with Numbers]
                        defaultChart: { type: string, example: India - Chart of Accounts }
        "5XX": { $ref: "#/components/responses/ServerError" }

  /growthx_core.api.v1.tenant.check_subdomain:
    get:
      tags: [signup]
      summary: Is this subdomain free?
      description: |
        For the sign-up form, as the customer types (at least 400 ms after the last keystroke). Checked within Core
        only (pattern, reserved names, existing sites), never on Press, so `auth.signup` can still return
        `409 subdomain_taken`. Upper case is lowered. Rate-limited to 120 per minute per IP address.
      operationId: checkSubdomain
      x-phase: 2
      security: []
      parameters:
        - name: subdomain
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The answer (also when the name is invalid)
          content:
            application/json:
              schema:
                type: object
                required: [subdomain, address, available, reason, suggestion]
                properties:
                  subdomain: { type: string, example: noor-solar }
                  address:
                    type: string
                    example: noor-solar.tbogrowthx.com
                    description: The full address the site would get (`test-...` on the Core test site)
                  available: { type: boolean }
                  reason:
                    type: string
                    nullable: true
                    enum: [invalid, reserved, taken, null]
                    description: Why it isn't available; null when it is
                  suggestion:
                    type: string
                    nullable: true
                    example: noor-solar-2
                    description: A free name close to a taken or reserved one; null otherwise
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: The refresh token is rotated. The old refresh token and its access token are revoked.
      operationId: refreshToken
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: "`invalid_token`: the refresh token is unknown, expired or revoked. The client must log in again."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.auth.logout:
    post:
      tags: [auth]
      summary: Revoke the current access token and its refresh token
      operationId: logout
      x-phase: 1
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /growthx_core.api.v1.auth.me:
    get:
      tags: [auth]
      summary: The current user
      operationId: me
      x-phase: 1
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /growthx_core.api.v1.auth.forgot_password:
    post:
      tags: [auth]
      summary: Email a password-reset link
      description: |
        Always returns 202, whether or not the email exists, so the endpoint can't be used to find out which
        emails have accounts. Also 202 when the email can't be sent (e.g. no outgoing email account); the
        failure goes to the Error Log for admins.
      operationId: forgotPassword
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.auth.reset_password:
    post:
      tags: [auth]
      summary: Set a new password with the emailed reset key
      description: Revokes all of the user's existing tokens.
      operationId: resetPassword
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, newPassword]
              properties:
                key: { type: string }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: "`invalid_reset_key`: the key is unknown, expired or already used"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- customer
  /growthx_core.api.v1.customer.sites:
    get:
      tags: [customer]
