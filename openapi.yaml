        - { name: month, in: query, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }, description: "Month the customer paid, YYYY-MM" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: sort, in: query, schema: { type: string, enum: [earnedAt, -earnedAt, amount, -amount], default: -earnedAt } }
