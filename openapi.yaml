      tags: [customer]
      summary: Close the account (delete it)
      description: |
        Cancels the account's subscriptions, archives its sites (Press backs each one up before deleting it)
        and blocks signing in; every session is revoked. Tax invoices are kept — GST keeps them, and they
        carry the customer's name. `422 validation_failed` with `fields.confirm` when the typed confirmation
        isn't the account's email address.
      operationId: deleteCustomerAccount
