        - { name: to, in: query, schema: { type: string, format: date, example: "2026-10-20" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [start, -start, createdAt, -createdAt], default: start } }
