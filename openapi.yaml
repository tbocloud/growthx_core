        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /growthx_core.api.v1.admin.upload_content_image:
    post:
      tags: [content]
      summary: "Upload a cover or inline image"
      description: |
        Server-side upload (the website server forwards the editor's file). Core checks the file is really a
        JPEG, PNG or WebP by decoding it (not by its name or Content-Type), at most 5 MB and 6000 × 6000 px;
        SVG, GIF and anything else → `422 fields.file`. Core re-encodes it, which strips EXIF and location data,
        and stores it in S3 under `content/<site>/<yyyy>/<random>.<ext>`, served through the media CDN
        (e.g. `https://media.tbogrowthx.com/…`). Core keeps only the URL. Nothing is stored on the Core host.
        Stored with its Content-Type and `Cache-Control: public, max-age=31536000, immutable` (every upload gets
        a new random name, so a URL never changes content). The first frame of an animated image is kept; the
        photo is turned upright from its EXIF orientation before EXIF is dropped. Rate limit: 60 uploads per user
        per hour.
      operationId: adminUploadContentImage
      x-content-phase: 2
      x-phase: 4
      x-roles: [admin, content_editor]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [site, file]
              properties:
                site: { $ref: "#/components/schemas/ContentSiteSlugValue" }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentImage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`storage_unavailable`: S3 is not configured or not reachable; nothing was stored"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

