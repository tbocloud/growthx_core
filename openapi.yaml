            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /growthx_core.api.v1.customer.billing_details:
    get:
      tags: [customer]
      summary: The billing name, address and GSTIN printed on the customer's tax invoices
      description: |
        `complete` is false until the customer has saved a billing address; `billing.create_checkout` refuses
        (`422 billing_details_required`) until then. Show the form before Pay, and in Billing.
      operationId: customerGetBillingDetails
      x-phase: 3
      x-roles: [customer]
      responses:
        "200":
          description: Billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /growthx_core.api.v1.customer.update_billing_details:
    post:
      tags: [customer]
      summary: Save the billing address and (optional) GSTIN
      description: |
        Replaces the billing details: send every field (`billingName`, `addressLine2` and `gstin` may be null).
        `billingName` is the customer name on the invoice, e.g. the legal name on the GST registration; null
        means the account's company name. The GSTIN is
        checked (format, check digit, and its first two digits must be the state's GST code; GrowthX's own
        GSTIN is refused) and so is the PIN code against the state; problems come back as `422
        validation_failed` with `fields`.

        With a GSTIN the customer is invoiced as Registered Regular, without one as Unregistered. GST is CGST +
        SGST for Kerala and IGST for every other state.

        A change is written to the customer's history (`billing_details_updated`). Invoices already issued keep
        the details they were issued with. An unpaid checkout whose invoice has a
        different billing name, address, state or GSTIN is replaced by a new invoice on the next `billing.create_checkout` (or that
        call returns `409 payment_in_progress` while a PayU payment for it may still go through).
      operationId: customerUpdateBillingDetails
      x-phase: 3
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingDetailsInput" }
      responses:
        "200":
          description: Saved billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PaymentUnavailable" }

  # ---------------------------------------------------------------- billing
  /growthx_core.api.v1.billing.create_checkout:
    post:
      tags: [billing]
      summary: Start an online payment (PayU) for a plan
      description: |
        Core invoices the plan (a Sales Invoice, GST included as the plan says) and starts a PayU payment for
        it. The amount comes from the plan, on the server; clients never send it. The browser then submits
        `redirect.fields` to `redirect.url` as an ordinary HTML form POST (a full-page navigation, not fetch).
        After paying, PayU sends the customer back to the billing page with `?payu_txnid=<id>`: call
        `billing.checkout_status` with it.

        Calling again before paying (a failed or abandoned payment) reuses the same invoice and starts a new
        PayU attempt. An unpaid checkout for another plan of the same product, or at an old price, is
        cancelled (`409 payment_in_progress` instead while a PayU payment for it may still go through). The
        payment applies to the customer's subscription for the plan's product, exactly like
        `admin.record_payment`. Online payment is off (`503 payment_unavailable`) until Core's site config
        names a PayU gateway account.

        The customer must have saved `customer.billing_details` first: until then, `422
        billing_details_required`.

        **GST invoicing:** the invoice is a GST tax invoice (GX/26-27/0001) for `customer.billing_details`:
        the billing name, address and GSTIN. The plan price includes the plan's GST (18%), split CGST + SGST
        for a customer in Kerala and IGST elsewhere, so the total is always the plan price (`invoice.subtotal`
        + `invoice.tax`). An unpaid checkout issued before GST invoicing, or with a different billing name,
        address, state or GSTIN than the customer's current details, is also replaced (same `409
        payment_in_progress` rule). If Core can't make the invoice exactly (GST not set up, a plan priced
        without GST), it answers `503 payment_unavailable` and charges nothing.
      operationId: createCheckout
      x-phase: 3
      x-roles: [customer]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                billingInterval:
                  allOf: [{ $ref: "#/components/schemas/BillingInterval" }]
                  description: Optional; if sent it must match the plan's interval
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`invalid_transition` (already paid for lifetime access, or the account can't take a payment), `payment_in_progress` (PayU has already authorized a payment for this checkout, so a new attempt would charge the customer twice; or an earlier checkout for this product is part-paid, or has a PayU attempt that may still succeed: any attempt Authorized, or the newest Queued and under 30 minutes old; try again later), or `idempotency_conflict`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`billing_details_required` (no billing address saved yet: show the billing details form, then call again), `invalid_plan` (unknown or retired plan, interval mismatch), or `validation_failed` (no subscription for the plan's product)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PaymentUnavailable" }

  /growthx_core.api.v1.billing.checkout_status:
    get:
      tags: [billing]
      summary: The result of an online payment
      description: |
        For the billing page after PayU's return (`txnid` = the `payu_txnid` query parameter), or with the
        checkout `reference`. Only the customer's own checkouts are found (404 otherwise). PayU's answer is
        verified on Core's side before anything is marked paid; this call only reads the result.

        `status`: `pending` (not paid yet, or PayU is still confirming: check again in a few seconds; also while
        PayU has authorized a payment that Core hasn't completed yet, even if a later attempt failed),
        `paid` (the plan is active; `subscription` is set), `failed` (the payment didn't go through: offer
        to try again, which calls `billing.create_checkout` again), `attention` (we received the money but
        the plan couldn't be activated automatically: our team does it; tell the customer it's in hand),
        `reversed` (the payment was received but has since been cancelled or refunded on our side: our team
        reviews the plan; don't say the payment was received or that the plan is being activated).
      operationId: checkoutStatus
      x-phase: 3
      x-roles: [customer]
      parameters:
        - { name: txnid, in: query, schema: { type: string, maxLength: 40 }, description: "PayU's transaction id from the return URL" }
        - { name: reference, in: query, schema: { type: string, maxLength: 40 }, description: "`reference` from the checkout session" }
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`validation_failed`: neither txnid nor reference"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

