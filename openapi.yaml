  /growthx_core.api.v1.customer.invoice_pdf:
    get:
      tags: [customer]
      summary: One of the customer's invoices as a PDF (the GST tax invoice)
      description: |
        The GST tax invoice (GrowthX's "GrowthX Tax Invoice" print format: GrowthX's name, address and GSTIN,
