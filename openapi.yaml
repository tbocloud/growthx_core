          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkCommissionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.void_commissions:
    post:
      tags: [admin]
      summary: Void commissions (bulk)
      description: |
        `pending` or `approved` → `void` for up to 200 ids, with a reason (e.g. a refund). A commission in a draft
        payout leaves it and the payout is recalculated (cancelled if nothing is left). A paid commission is left
        alone (`already_paid`). Each one is audit-logged. Accepts `Idempotency-Key`.
      operationId: adminVoidCommissions
      x-phase: 3
      x-roles: [admin]
      parameters:
