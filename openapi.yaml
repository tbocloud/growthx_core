  /growthx_core.api.v1.admin.commissions:
    get:
      tags: [admin]
      summary: Partner commissions
      description: |
        Every commission, newest payment first, with `totals` (paise per status) for the same partner and month
        filter. A commission is created when a customer a partner referred pays (one per payment) and is
        `pending` until approved. `void`: the payment was refunded or an admin voided it.
      operationId: adminListCommissions
      x-phase: 3
