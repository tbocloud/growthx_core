      operationId: listCustomerSites
      x-phase: 2
      x-roles: [customer]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /growthx_core.api.v1.customer.site:
    get:
      tags: [customer]
      summary: One site, including provisioning progress (poll this after sign-up)
      description: |
        Poll every 5 s while the status is `requested` or `provisioning`. Stop polling at `ready`, `failed`, or after 15 minutes.
        A site that doesn't belong to the caller returns 404, not 403.
      operationId: getCustomerSite
      x-phase: 2
      x-roles: [customer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /growthx_core.api.v1.customer.open_site:
    post:
      tags: [customer]
      summary: Get a short-lived, single-use sign-in URL for the customer's site
      description: |
        Request this only when the user clicks "Open app", then navigate to it straight away. Never store, log or prefetch the URL.
        The URL carries an opaque, random, single-use token. The token expires 60 s after it is issued. The tenant exchanges
        it for a normal session and redirects to a clean URL. Responses send `Cache-Control: no-store`.
        Every issued link is audit-logged (who, which site, when), but the token itself is never logged.
        The URL is `{siteUrl}/api/method/growthx_theme.sso.login?token=…`. The tenant redeems the token with
        `tenant.redeem_login`, logs the customer in as their own user and redirects to the desk. An expired, reused
        or wrong-site link ends on the tenant's `/login` page with "This link has expired. Open your app again from GrowthX."
      operationId: openCustomerSite
      x-phase: 2
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: Sign-in URL
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`site_not_ready`: the site's status is not `ready`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

