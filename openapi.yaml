  # ---------------------------------------------------------------- billing
  /growthx_core.api.v1.billing.create_checkout:
    post:
      tags: [billing]
      summary: Start a payment for a plan (trial to paid, or a new subscription)
      description: |
        The amount is calculated on the server; clients never send it. The response is gateway-neutral:
        `provider` selects the browser or SDK adapter. `publicKey` is a public key only, never a secret.
      operationId: createCheckout
      x-phase: 3
      x-roles: [customer]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, billingInterval]
              properties:
                planId: { type: string }
                billingInterval: { $ref: "#/components/schemas/BillingInterval" }
                subscriptionId:
                  type: string
                  description: The existing trial subscription being converted. If omitted, a new subscription is created.
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`idempotency_conflict`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/PaymentUnavailable" }
        "422":
          description: "`invalid_plan`, or `validation_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.billing.verify_checkout:
    post:
      tags: [billing]
      summary: Confirm a completed payment for instant feedback
      description: |
        The server verifies the gateway signature. The **gateway webhook** (server-to-server, not part of this
        client contract) is the source of truth for activation, renewals, failures and cancellations.
        This call is idempotent: verifying the same payment twice returns the same result.
      operationId: verifyCheckout
      x-phase: 3
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, reference, payload]
              properties:
                provider: { $ref: "#/components/schemas/PaymentProvider" }
                reference: { type: string, description: "`reference` from the checkout session" }
                payload:
                  type: object
                  additionalProperties: true
                  description: Exactly what the gateway's browser or mobile SDK returned
                  example:
                    razorpay_payment_id: pay_29QQoUBi66xm2f
                    razorpay_subscription_id: sub_NgQ8kTgV5bE2xY
                    razorpay_signature: 9ef4dffb
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription: { $ref: "#/components/schemas/Subscription" }
                  invoice:
                    allOf: [{ $ref: "#/components/schemas/Invoice" }]
                    nullable: true
                    description: Null if the invoice hasn't been created yet; it arrives through the webhook
        "400":
          description: "`payment_verification_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/PaymentUnavailable" }

