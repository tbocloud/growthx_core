  /growthx_core.api.v1.admin.save_content_redirect:
    post:
      tags: [content]
      summary: "[PROPOSED · phase 2] Create or update a redirect"
      description: |
        Keyed by `site` + `fromPath`. Rules (each a `422` with the code in `error.code` and the field in `fields`):

        - `fromPath`: starts with `/` (not `//`), no fragment, at most 500 characters, not `/` itself.
        - `toPath`: a path on the same site (`/…`, not `//…`), or an `https://` URL whose host is one of
          tbogrowthx.com, printagx.in, willpex.in, billax.in, phoebix.in, stayvex.in or their `www.` names.
          No `http://`, other hosts, user-info (`user@host`) or ports; anything else → `target_not_allowed`.
        - `redirect_loop`: `toPath` equals `fromPath`, or `toPath` is itself the `fromPath` of an enabled
          redirect on the same site (no chains either).

        Audit-logged; revalidates `fromPath`.
      operationId: adminSaveContentRedirect
      x-status: proposed
      x-content-phase: 2
      x-phase: 4
      x-roles: [admin, content_editor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentRedirectInput" }
      responses:
