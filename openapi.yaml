          description: The saved redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentRedirect" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`validation_failed`, `target_not_allowed` or `redirect_loop`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /growthx_core.api.v1.admin.delete_content_redirect:
