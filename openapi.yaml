        "404": { $ref: "#/components/responses/NotFound" }

  /growthx_core.api.v1.admin.update_appointment:
    post:
      tags: [admin]
      summary: One workflow action on a booking
      description: |
        | `action` | Needs | Effect |
        |---|---|---|
        | `reschedule` | `start` (a free time) | Moves the call, keeps the expert when free, updates the Event, emails the visitor and expert |
        | `reassign` | `expert` (from settings) | Changes the expert (`409 expert_busy` if they have a call then), emails |
        | `cancel` | `reason`? | Cancels, frees the slot, cancels the Event, emails an apology with a link to rebook |
        | `complete` | — | Marks the call held. Only once it has started (`409 not_started`) |
        | `no_show` | — | Marks the visitor absent. Only once it has started |
        | `note` | `note` | Appends a dated internal note (never shown to the visitor). Allowed in any status |

        Every action except `note` needs a `confirmed` booking (`409 not_changeable`). All actions are audit-logged.
      operationId: adminUpdateAppointment
      x-phase: 2
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: string }
                action: { type: string, enum: [reschedule, reassign, cancel, complete, no_show, note] }
                start: { type: string, format: date-time }
                expert: { type: string, format: email }
                reason: { type: string, maxLength: 500 }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`slot_taken`, `expert_busy`, `not_changeable` or `not_started`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

