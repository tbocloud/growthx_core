                    required: [items, totals]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminCommission" }
                      totals:
                        type: object
                        required: [pending, approved, paid, void]
                        properties:
                          pending: { $ref: "#/components/schemas/Money" }
                          approved: { $ref: "#/components/schemas/Money" }
                          paid: { $ref: "#/components/schemas/Money" }
                          void: { $ref: "#/components/schemas/Money" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /growthx_core.api.v1.admin.approve_commissions:
    post:
      tags: [admin]
      summary: Approve commissions (bulk)
      description: |
        `pending` → `approved` for up to 200 ids. One that isn't pending, or is still inside the hold period
        (Partner Program Settings, `hold_days`), is left alone and named in `skipped` (`already_<status>`,
        `on_hold`, `not_found`). Each approval is audit-logged and the partner is notified. Accepts `Idempotency-Key`.
      operationId: adminApproveCommissions
      x-phase: 3
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
      responses:
